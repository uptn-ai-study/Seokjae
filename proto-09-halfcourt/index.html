<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>HALF COURT — 반코트 축구</title>
<meta name="description" content="반코트 2v2 캐주얼 축구. 탭과 스와이프만으로 즐기는 모바일 게임." />
<style>
  :root{
    --grass:#2E7D5B; --grass-dark:#256B4D; --grass-line:#F5EFE0;
    --coral:#FF6B5E; --coral-dark:#E05549;
    --blue:#4A7DFF; --blue-dark:#3A63D8;
    --yellow:#FFD23F; --danger:#EF4444; --skin:#F2C49B;
    --ui:#1F2937; --ui-2:#374151;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:#0E1116;overflow:hidden;
    font-family:'SUIT Variable','SUIT',-apple-system,BlinkMacSystemFont,sans-serif;
    color:#fff; user-select:none; -webkit-user-select:none;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #wrap{position:relative;width:min(100vw,100vh,480px);height:min(100vw,100vh,480px);
    background:var(--grass);box-shadow:0 12px 48px rgba(0,0,0,.5);overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}

  /* ===== HUD ===== */
  #hud{position:absolute;top:0;left:0;right:0;height:10%;display:flex;align-items:center;
    justify-content:space-between;padding:0 12px;z-index:5;pointer-events:none;
    background:linear-gradient(to bottom,rgba(0,0,0,.28),rgba(0,0,0,0));}
  .score{display:flex;align-items:center;gap:7px;font-weight:700;}
  .dot{width:13px;height:13px;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.4);}
  .dot.a{background:var(--coral);} .dot.b{background:var(--blue);}
  .score .num{font-size:21px;letter-spacing:-.5px;text-shadow:0 1px 4px rgba(0,0,0,.5);}
  #center-hud{display:flex;flex-direction:column;align-items:center;gap:1px;}
  #timer{font-size:19px;font-weight:700;letter-spacing:.5px;font-variant-numeric:tabular-nums;
    text-shadow:0 1px 4px rgba(0,0,0,.5);transition:color .3s;}
  #phase{font-size:10px;font-weight:700;letter-spacing:1px;opacity:.92;
    padding:1px 8px;border-radius:9999px;background:rgba(0,0,0,.3);}

  /* ===== bottom hint ===== */
  #hint{position:absolute;bottom:0;left:0;right:0;height:5%;display:flex;align-items:center;
    justify-content:center;z-index:5;pointer-events:none;font-size:10px;color:rgba(255,255,255,.75);
    letter-spacing:.3px;transition:opacity .6s;}

  /* loose-ball timer bar */
  #loose-bar{position:absolute;left:50%;top:11%;transform:translateX(-50%);
    width:42%;height:6px;border-radius:9999px;background:rgba(0,0,0,.35);z-index:6;
    overflow:hidden;display:none;}
  #loose-fill{height:100%;width:100%;background:var(--danger);border-radius:9999px;
    transform-origin:left center;}

  /* ===== overlays ===== */
  .overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:24px;
    background:rgba(14,17,22,.82);backdrop-filter:blur(3px);}
  .hidden{display:none!important;}

  .logo{font-size:11vmin;font-weight:700;line-height:.92;letter-spacing:-1px;}
  .logo .l1{color:var(--coral);} .logo .l2{color:var(--blue);}
  .tag{margin-top:8px;font-size:13px;color:#9CA3AF;letter-spacing:.3px;}
  .ball-deco{font-size:30px;margin-bottom:6px;animation:spin 4s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .seg-label{margin-top:26px;font-size:12px;color:#9CA3AF;letter-spacing:2px;font-weight:700;}
  .seg{display:flex;gap:8px;margin-top:10px;}
  .seg button{width:78px;height:48px;border-radius:12px;border:1.5px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.06);color:#fff;font-size:15px;font-weight:700;cursor:pointer;
    transition:.15s;}
  .seg button.on{background:var(--coral);border-color:var(--coral);color:#fff;
    box-shadow:0 4px 16px rgba(255,107,94,.45);}

  .btn-primary{margin-top:30px;width:200px;height:56px;background:var(--coral);color:#fff;
    font-size:17px;font-weight:700;letter-spacing:.5px;border-radius:14px;border:none;cursor:pointer;
    box-shadow:0 6px 22px rgba(255,107,94,.5);transition:transform .1s;}
  .btn-primary:active{transform:scale(.96);background:var(--coral-dark);}
  .btn-ghost{margin-top:14px;background:none;border:none;color:#9CA3AF;font-size:13px;
    text-decoration:underline;cursor:pointer;}

  /* halftime / result big text */
  .big{font-size:9vmin;font-weight:700;letter-spacing:-1px;}
  .sub{margin-top:6px;font-size:14px;color:#9CA3AF;}
  .vs{display:flex;align-items:center;gap:18px;margin-top:22px;font-weight:700;}
  .vs .team{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .vs .team .sc{font-size:14vmin;line-height:.9;}
  .vs .team .nm{font-size:12px;color:#9CA3AF;letter-spacing:1px;}
  .vs .x{font-size:5vmin;color:#6B7280;}
  .teamA{color:var(--coral);} .teamB{color:var(--blue);}

  /* how-to mini */
  .howto{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11px;
    color:#6B7280;line-height:1.7;padding:0 24px;}

  /* countdown overlay for last 5s */
  #count-big{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    z-index:15;pointer-events:none;font-size:38vmin;font-weight:700;color:rgba(255,255,255,.92);
    text-shadow:0 0 40px rgba(239,68,68,.7);}

  /* whistle / goal toast */
  #toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.6);
    z-index:14;font-size:11vmin;font-weight:700;letter-spacing:-1px;opacity:0;pointer-events:none;
    text-shadow:0 4px 24px rgba(0,0,0,.6);}
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="score"><span class="dot a"></span><span class="num" id="scoreA">0</span></div>
      <div id="center-hud">
        <div id="timer">0:20</div>
        <div id="phase">전반 · 공격</div>
      </div>
      <div class="score"><span class="num" id="scoreB">0</span><span class="dot b"></span></div>
    </div>

    <div id="loose-bar"><div id="loose-fill"></div></div>
    <div id="count-big"></div>
    <div id="toast"></div>

    <div id="hint">탭=이동 · 스와이프↑=슛 · 동료 탭=패스</div>

    <!-- TITLE -->
    <div class="overlay" id="ov-title">
      <div class="ball-deco">⚽</div>
      <div class="logo"><span class="l1">HALF</span> <span class="l2">COURT</span></div>
      <div class="tag">반코트 2v2 · 탭 & 스와이프 축구</div>

      <div class="seg-label">경기 시간</div>
      <div class="seg" id="seg-time">
        <button data-sec="20">20초</button>
        <button data-sec="60" class="on">1분</button>
        <button data-sec="180">3분</button>
      </div>

      <button class="btn-primary" id="btn-start">킥오프</button>
      <div class="howto">
        공 뺏기면 하단 <b style="color:#FFD23F">클리어 라인</b> 아래로 빼야 공격 가능 · 스틸→역습→득점<br>
        ↑스와이프=슛 · 동료 탭=패스 · 수비 땐 근접 후 탭=태클 · 동료 탭=수비 전환
      </div>
    </div>

    <!-- HALFTIME -->
    <div class="overlay hidden" id="ov-half">
      <div class="big">하프타임</div>
      <div class="sub">역할이 교대됩니다</div>
      <div class="vs">
        <div class="team teamA"><div class="sc" id="halfA">0</div><div class="nm">YOU</div></div>
        <div class="x">:</div>
        <div class="team teamB"><div class="sc" id="halfB">0</div><div class="nm">AI</div></div>
      </div>
      <div class="sub" id="half-next" style="margin-top:18px;"></div>
      <button class="btn-primary" id="btn-half">후반 시작</button>
    </div>

    <!-- RESULT -->
    <div class="overlay hidden" id="ov-result">
      <div class="big" id="result-title">승리!</div>
      <div class="vs">
        <div class="team teamA"><div class="sc" id="resA">0</div><div class="nm">YOU</div></div>
        <div class="x">:</div>
        <div class="team teamB"><div class="sc" id="resB">0</div><div class="nm">AI</div></div>
      </div>
      <button class="btn-primary" id="btn-replay">다시 하기</button>
      <button class="btn-ghost" id="btn-menu">시간 다시 선택</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* =========================================================================
   HALF COURT — 반코트 축구 (단일 HTML / Canvas 2D / 외부 의존성 없음)
   GDD v1.0 구현
   ========================================================================= */

// ---------- Canvas & virtual resolution ----------
const W = 480, H = 480;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fitCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
fitCanvas();
window.addEventListener('resize', fitCanvas);

// ---------- Layout (square) ----------
const HUD_H = H * 0.10;          // 48
const HINT_H = H * 0.05;         // 24
const COURT = { left:22, right:W-22, top:HUD_H+12, bottom:H-HINT_H-12 };
const GOAL = { cx:W/2, w:130, y:COURT.top };           // goal mouth at top
GOAL.left = GOAL.cx - GOAL.w/2; GOAL.right = GOAL.cx + GOAL.w/2;

// Penalty area (wide box) & 6-yard box (near)
const PEN_AREA = { left:W/2-95, right:W/2+95, top:COURT.top, bottom:COURT.top+118 };
const PEN_BOX  = { left:W/2-62, right:W/2+62, top:COURT.top, bottom:COURT.top+74 };

// streetball "clear" line near the bottom — a team that wins the ball must carry/pass
// it below this line before they are allowed to attack the goal (creates counterattacks)
const CLEAR_LINE_Y = COURT.bottom - 150;

// ---------- Palette ----------
const C = {
  grass:'#2E7D5B', grassDk:'#256B4D', line:'rgba(245,239,224,.55)',
  coral:'#FF6B5E', coralDk:'#E05549', blue:'#4A7DFF', blueDk:'#3A63D8',
  yellow:'#FFD23F', danger:'#EF4444', skin:'#F2C49B', net:'rgba(245,239,224,.85)'
};

// ---------- Game state ----------
const GS = { TITLE:0, PLAY:1, RESULT:3, GOAL_CELEB:4 };
let game = null;

// loose-ball countdown length by match-duration option
function looseLenFor(sec){ return sec <= 20 ? 2.0 : 2.6; }

// ---------- Entities ----------
function mkPlayer(team, x, y){
  return { team, isHuman:false, x, y, vx:0, vy:0, r:13,
           tx:x, ty:y,                 // movement target
           aiState:'SUPPORT', stealCd:0, passCd:0, role:'def' };
}

function newMatch(matchSec){
  return {
    state: GS.TITLE,
    halfSec: matchSec,        // total match length (single continuous period)
    looseLen: looseLenFor(matchSec),
    time: matchSec,           // counts down
    score: { A:0, B:0 },
    attacking: 'A',           // team currently in possession / on offense (dynamic)
    cleared: true,            // has the attacking team cleared the ball below the line?
    controlled: null,         // which team-A player the human is steering
    manualPick: null, manualT: 0,   // manual defender switch (sticky for a moment)
    clearFx: 0,               // "CLEAR!" flash timer
    players: [],
    ball: { x:W/2, y:0, vx:0, vy:0, r:9, owner:null, loose:false,
            looseT:0, flying:false, spin:0, trail:[] },
    particles: [],
    shotCd:0, shake:0, flash:0,
    goalLock:0,
  };
}

// roles follow possession every frame
function assignRoles(g){
  for(const p of g.players) p.role = (p.team===g.attacking) ? 'atk' : 'def';
}

// place players for the opening tip-off. A starts with the ball, already cleared.
function setupPlayers(g){
  g.players = [];
  const cx = W/2;
  g.players.push(mkPlayer('A', cx-34, COURT.bottom-70));      // A1
  g.players.push(mkPlayer('A', cx+46, COURT.bottom-104));     // A2
  g.players.push(mkPlayer('B', cx-30, COURT.top+110));        // B1
  g.players.push(mkPlayer('B', cx+34, COURT.top+128));        // B2
  g.attacking='A'; g.cleared=true; g.manualPick=null; g.manualT=0;
  assignRoles(g);
  const owner = g.players.find(p=>p.team==='A');
  g.ball.owner=owner; g.ball.loose=false; g.ball.flying=false;
  g.ball.vx=0; g.ball.vy=0; g.ball.trail=[];
  positionBallToOwner(g);
  updateControl(g);
}

// the human always steers team A's ball-carrier; when defending, the A player
// nearest the ball (or a manually-picked one) — classic auto-switch.
function updateControl(g){
  const aP=g.players.filter(p=>p.team==='A'); if(!aP.length) return;
  let target;
  if(g.ball.owner && g.ball.owner.team==='A'){
    target=g.ball.owner;
  } else if(g.manualPick && g.manualT>0 && aP.includes(g.manualPick)){
    target=g.manualPick;
  } else {
    const b=g.ball;
    target=aP.slice().sort((a,c)=>dist(a.x,a.y,b.x,b.y)-dist(c.x,c.y,b.x,b.y))[0];
  }
  if(target && target!==g.controlled){ target.tx=target.x; target.ty=target.y; } // stop drift on switch
  for(const p of aP) p.isHuman=(p===target);
  g.controlled=target;
}

function human(g){ return g.controlled || g.players.find(p=>p.team==='A' && p.isHuman) || g.players.find(p=>p.team==='A'); }

// ---------- Possession / clear flow ----------
function gainPossession(g, p, opts){
  const b=g.ball;
  b.owner=p; b.loose=false; b.flying=false; b.vx=b.vy=0; b._pending=null; b._passTarget=null;
  hideLooseBar();
  const teamChanged = (p.team!==g.attacking);
  g.attacking=p.team;
  if(teamChanged || (opts&&opts.forceClear)) g.cleared=false;
  assignRoles(g);
  positionBallToOwner(g);
}
function updateClear(g){
  if(g.cleared) return;
  const o=g.ball.owner;
  if(o && o.team===g.attacking && o.y > CLEAR_LINE_Y){
    g.cleared=true; g.clearFx=0.9; g.flash=0.12;
    flashToast('CLEAR!', o.team==='A'?C.coral:C.blue);
    Audio.whistleShort(); if(o.isHuman) haptic([20]);
  }
}

// ---------- Helpers ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function clampToCourt(p){
  p.x = clamp(p.x, COURT.left+p.r, COURT.right-p.r);
  p.y = clamp(p.y, COURT.top+p.r, COURT.bottom-p.r);
}
function positionBallToOwner(g){
  const o=g.ball.owner; if(!o) return;
  // ball sits slightly ahead toward goal
  g.ball.x = o.x; g.ball.y = o.y - o.r - 2;
}

// ---------- Shot system (GDD §3) ----------
function nearestDefenders(g, x, y){
  const defs = g.players.filter(p=>p.role==='def')
    .map(p=>({p, d:dist(x,y,p.x,p.y)})).sort((a,b)=>a.d-b.d);
  return defs;
}
function pressureCoef(g, x, y){
  const f = d => Math.max(0, 1 - d/120);
  const ds = nearestDefenders(g,x,y);
  const d1 = ds[0]?ds[0].d:999, d2 = ds[1]?ds[1].d:999;
  return clamp(1 - (0.7*f(d1) + 0.3*f(d2)), 0, 1);
}
function zoneBase(x,y){
  const d = dist(x,y,GOAL.cx,GOAL.y);
  const inPenWidth = x>PEN_AREA.left-10 && x<PEN_AREA.right+10;
  if(d < 95 && inPenWidth) return 0.80;     // penalty box
  if(d < 200) return 0.50;                   // mid range
  return 0.22;                               // long range
}
// swipe accuracy: 1 when aimed straight at goal centre, lower as angle deviates
function swipeAccuracy(x,y,ang){
  const ideal = Math.atan2(GOAL.y - y, GOAL.cx - x);
  let diff = Math.abs(ang - ideal);
  while(diff>Math.PI) diff = Math.abs(diff-2*Math.PI);
  // up to ~50deg deviation degrades accuracy down to 0.45
  const t = clamp(diff / (50*Math.PI/180), 0, 1);
  return 1 - t*0.55;
}
function inAttackZone(g, p){
  // must be in top ~62% of court (past attacking half) to shoot
  return p.y < COURT.top + (COURT.bottom-COURT.top)*0.62;
}

function attemptShot(g, shooter, ang, power){
  const x=shooter.x, y=shooter.y;
  const base = zoneBase(x,y);
  const acc  = swipeAccuracy(x,y,ang);
  const press= pressureCoef(g,x,y);
  let pGoal = base * acc * press;
  pGoal = Math.max(0.04, pGoal);                       // GDD min
  let pSave = (1-pGoal) * press * 0.55;
  let pMiss = 1 - pGoal - pSave;
  if(pMiss < 0.05){ pMiss = 0.05; pSave = Math.max(0, 1-pGoal-pMiss); }

  // launch ball visually toward aim point on goal line
  const aimX = clamp(x + Math.cos(ang)* (y-GOAL.y) / Math.max(0.2,-Math.sin(ang)) , GOAL.left-30, GOAL.right+30);
  const tx = clamp(aimX, GOAL.left-20, GOAL.right+20), ty = GOAL.y;
  const spd = clamp(power*0.16, 6, 12);
  const a2 = Math.atan2(ty-y, tx-x);
  g.ball.owner=null; g.ball.loose=false; g.ball.flying=true;
  g.ball.vx=Math.cos(a2)*spd; g.ball.vy=Math.sin(a2)*spd;
  g.ball.x=x; g.ball.y=y-shooter.r;

  // decide outcome now, resolve when ball reaches goal line
  const roll=Math.random();
  let outcome = roll<pGoal ? 'goal' : (roll<pGoal+pSave ? 'save':'miss');
  g.ball._pending = { outcome, team:shooter.team, tx, ty };
  Audio.kick();
  haptic(shooter.isHuman ? [40] : null);
  shooter.aiState='SUPPORT';
}

// ---------- Pass ----------
function passTo(g, from, to){
  if(!to) return;
  g.ball.owner=null; g.ball.loose=false; g.ball.flying='pass';
  const a=Math.atan2(to.y-from.y, to.x-from.x);
  const d=dist(from.x,from.y,to.x,to.y);
  const spd=clamp(d*0.12, 5, 10);
  g.ball.vx=Math.cos(a)*spd; g.ball.vy=Math.sin(a)*spd;
  g.ball.x=from.x; g.ball.y=from.y-from.r;
  g.ball._passTarget=to;
  Audio.pass();
}

// ---------- Steal -> loose ball (GDD §4) ----------
function doSteal(g, defender){
  const o=g.ball.owner; if(!o) return;
  const a=Math.atan2(g.ball.y-defender.y, g.ball.x-defender.x);
  const dev=(Math.random()*2-1)*(25*Math.PI/180);
  const power=4.5+Math.random()*2.0;
  g.ball.owner=null; g.ball.loose=true; g.ball.flying=false;
  g.ball.vx=Math.cos(a+dev)*power; g.ball.vy=Math.sin(a+dev)*power;
  // loose-ball reset point depends on where steal happened
  const inPen = g.ball.x>PEN_AREA.left && g.ball.x<PEN_AREA.right && g.ball.y<PEN_AREA.bottom;
  g.ball._resetPen = inPen;
  g.ball._stealX = g.ball.x; g.ball._stealY=g.ball.y;
  g.ball.looseT = g.looseLen;
  defender.stealCd = 0.8;
  Audio.whistleShort();
  haptic([20]);
}

// ---------- Input (GDD §2) ----------
let press=null; // {x,y,t, moved}
function toLocal(e){
  const r=canvas.getBoundingClientRect();
  const t=(e.touches&&e.touches[0])||e;
  return { x:(t.clientX-r.left)/r.width*W, y:(t.clientY-r.top)/r.height*H };
}
canvas.addEventListener('pointerdown', e=>{
  if(!game||game.state!==GS.PLAY) return;
  const p=toLocal(e); press={x:p.x,y:p.y,t:performance.now()};
  Audio.resume();
});
canvas.addEventListener('pointerup', e=>{
  if(!game||game.state!==GS.PLAY||!press) return;
  const p=toLocal(e);
  const dx=p.x-press.x, dy=p.y-press.y, d=Math.hypot(dx,dy);
  const dur=(performance.now()-press.t)/1000;
  handleGesture(p, dx, dy, d, dur);
  press=null;
});
canvas.addEventListener('pointercancel', ()=>press=null);

function handleGesture(pos, dx, dy, d, dur){
  const g=game, me=human(g);
  if(!me) return;
  const haveBall = g.ball.owner===me;
  const mate = g.players.find(p=>p.team===me.team && p!==me);
  const carrier = g.ball.owner;
  const defending = !(carrier && carrier.team==='A');

  // ===== OFFENSE (we have the ball) =====
  if(haveBall){
    const ang=Math.atan2(dy,dx);
    const up = ang < -50*Math.PI/180 && ang > -130*Math.PI/180;
    // swipe up = SHOOT (only once cleared, in the attacking zone, off cooldown)
    if(d>=14 && up){
      if(g.cleared && inAttackZone(g,me) && me.stealCd<=0 && g.shotCd<=0){
        attemptShot(g, me, ang, d); g.shotCd=0.55;
      } else {
        // can't shoot yet — dribble that way instead, nudge feedback
        dribbleDir(me, ang, d);
        if(!g.cleared) flashToast('먼저 클리어!', '#FFD23F');
      }
      return;
    }
    // tap teammate = pass (control will follow the ball)
    if(d<14 && mate && dist(pos.x,pos.y,mate.x,mate.y) < 40){ passTo(g,me,mate); return; }
    // otherwise move/dribble toward the gesture
    if(d<14){ me.tx=pos.x; me.ty=pos.y; }
    else dribbleDir(me, ang, d);
    return;
  }

  // ===== DEFENSE (opponent or loose ball) =====
  // tap your other teammate to switch control to them
  if(d<14 && mate && dist(pos.x,pos.y,mate.x,mate.y) < 40){
    g.manualPick=mate; g.manualT=2.5; updateControl(g); haptic([10]); return;
  }
  // near the carrier? any gesture = TACKLE attempt
  if(carrier && dist(me.x,me.y,carrier.x,carrier.y) < me.r+carrier.r+20 && me.stealCd<=0){
    attemptTackle(g, me, carrier); return;
  }
  // else chase / reposition toward the gesture point
  me.tx=pos.x; me.ty=pos.y;
}

function dribbleDir(me, ang, d){
  const len=clamp(d, 20, 140);
  me.tx=clamp(me.x+Math.cos(ang)*len, COURT.left, COURT.right);
  me.ty=clamp(me.y+Math.sin(ang)*len, COURT.top, COURT.bottom);
}

// player-initiated tackle: success pops the ball loose for a scramble (you're adjacent → likely win it)
function attemptTackle(g, defender, carrier){
  defender.stealCd=0.6;
  const press = 0.5 + 0.012*(1-(game.time/game.halfSec))*30;   // small ramp over the match
  if(Math.random() < clamp(press,0.45,0.72)){
    doSteal(g, defender);
    spark(g, carrier.x, carrier.y, C.yellow);
    haptic([30]);
  } else {
    Audio.miss(); spark(g, defender.x, defender.y, '#9CA3AF');   // whiffed — brief cooldown
    haptic([8]);
  }
}

// ---------- Movement integration ----------
function moveToward(p, speed){
  const dx=p.tx-p.x, dy=p.ty-p.y, d=Math.hypot(dx,dy);
  if(d>1.5){ p.x+=dx/d*Math.min(speed,d); p.y+=dy/d*Math.min(speed,d); }
  clampToCourt(p);
}

// ---------- AI: teammate / defense (GDD §5) ----------
function difficulty(g){
  const prog = 1 - g.time/g.halfSec;          // 0..1
  // steal is intentionally low — defense should CONTAIN; the ball is won mainly via
  // active tackles, forced contested shots (rebounds) and loose-ball scrambles
  if(prog<0.30) return {react:0.55, pos:0.6, speed:1.7,  steal:0.005};
  if(prog<0.70) return {react:0.80, pos:0.8, speed:1.95, steal:0.009};
  return            {react:1.00, pos:1.0, speed:2.2,  steal:0.014};
}

// --- spatial helpers ---
function teammate(g,p){ return g.players.find(q=>q.team===p.team && q!==p); }
function distToSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, l2=(dx*dx+dy*dy)||1;
  let t=((px-ax)*dx+(py-ay)*dy)/l2; t=clamp(t,0,1);
  return Math.hypot(px-(ax+dx*t), py-(ay+dy*t));
}
// is a defender genuinely in the shooting lane (close + tight to the line to goal)?
function laneBlocked(g,p){
  const toGoal=Math.atan2(GOAL.y-p.y, GOAL.cx-p.x);
  for(const d of g.players){
    if(d.role!=='def') continue;
    if(dist(p.x,p.y,d.x,d.y)>78) continue;    // only a nearby defender truly blocks
    if(d.y > p.y+8) continue;                  // must be goal-side (ahead)
    let diff=Math.abs(Math.atan2(d.y-p.y,d.x-p.x)-toGoal);
    while(diff>Math.PI) diff=Math.abs(diff-2*Math.PI);
    if(diff < 28*Math.PI/180) return d;
  }
  return null;
}
function passLaneOpen(g,from,to){
  const dx=to.x-from.x, dy=to.y-from.y, l2=(dx*dx+dy*dy)||1;
  for(const d of g.players){
    if(d.role!=='def') continue;
    // ignore defenders hugging the passer — only those actually along the lane matter
    const t=clamp(((d.x-from.x)*dx+(d.y-from.y)*dy)/l2,0,1);
    if(t<0.2) continue;
    const cx=from.x+dx*t, cy=from.y+dy*t;
    if(Math.hypot(d.x-cx, d.y-cy) < d.r+13) return false;
  }
  return true;
}
// quality of an attacking position: open (low pressure) + advanced (near goal)
function openScore(g,x,y){
  const press=pressureCoef(g,x,y);
  const adv=clamp(1-(y-GOAL.y)/((COURT.bottom-GOAL.y)||1),0,1);
  return press*0.68 + adv*0.32;
}

// profile differs for the player's helper (ally) vs the opponent attacker
function attackProfile(g,p){
  const diff=difficulty(g);
  const opp = (p.team!=='A');                  // human is always team A
  if(opp){
    return { ally:false, speed:diff.speed+0.1, offSpeed:diff.speed,
             shootOpen:0.45, shootRange:205, maxShots:99, unlimited:true, dribbleStep:62 };
  }
  return   { ally:true,  speed:1.75, offSpeed:1.7,
             shootOpen:0.78, shootRange:150, maxShots:2,  unlimited:false, dribbleStep:48 };
}

function updateAI(g, dt){
  assignRoles(g);
  const b=g.ball;
  for(const p of g.players){
    if(p.isHuman) { continue; }      // human handled by input
    p.stealCd=Math.max(0,p.stealCd-dt);
    p.passCd =Math.max(0,p.passCd-dt);

    if(b.flying===true){ aiDuringShot(g,p); continue; }      // shot in the air → crash for rebound
    if(b.flying==='pass'){                                    // ball travelling to a teammate
      if(b._passTarget && b._passTarget.team===p.team){
        if(b._passTarget===p){ p.tx=b.x+b.vx*2; p.ty=b.y+b.vy*2; moveToward(p,2.0); }
        else offBallMove(g,p,b._passTarget,attackProfile(g,p));
      } else aiDefense(g,p,dt,difficulty(g));
      continue;
    }
    if(b.loose || !b.owner){ aiLoose(g,p); continue; }       // scramble for the loose ball

    if(b.owner.team===p.team){                                // we have it → attack / support
      if(b.owner===p) carrierAct(g,p,attackProfile(g,p));
      else            offBallMove(g,p,b.owner,attackProfile(g,p));
    } else {
      aiDefense(g,p,dt,difficulty(g));                        // they have it → defend
    }
  }
}

// scramble: nearest player of EITHER team chases the loose ball; others anticipate
function aiLoose(g,p){
  const b=g.ball;
  const closest=g.players.slice().sort((a,c)=>dist(a.x,a.y,b.x,b.y)-dist(c.x,c.y,b.x,b.y))[0];
  if(closest===p){
    p.tx=clamp(b.x+b.vx*4, COURT.left+10, COURT.right-10);
    p.ty=clamp(b.y+b.vy*4, COURT.top+10,  COURT.bottom-10);
    const sp = (p.team!==g.attacking)? difficulty(g).speed+0.3 : 2.0;   // the team that lost it hustles to win it back
    moveToward(p, sp);
    if(dist(p.x,p.y,b.x,b.y) < p.r+b.r+4) recoverLoose(g,p);
  } else if(p.team===g.attacking){
    offBallMove(g,p,b,attackProfile(g,p));
  } else {
    p.tx=clamp(b.x, GOAL.left-10, GOAL.right+10);
    p.ty=clamp((b.y+GOAL.y)/2, COURT.top+24, COURT.bottom-40);
    moveToward(p, difficulty(g).speed*0.9);
  }
}

// shot in flight: everyone converges on the goal mouth for a possible rebound
function aiDuringShot(g,p){
  p.tx=clamp(GOAL.cx + (p.x<GOAL.cx?-30:30), GOAL.left-12, GOAL.right+12);
  p.ty=(p.team===g.attacking)? COURT.top+52 : COURT.top+32;
  moveToward(p, difficulty(g).speed*0.85);
}

// ball carrier: clear first if needed, then shoot on a real chance, else recycle / dribble to space
function carrierAct(g,p,prof){
  if(!g.cleared){ clearOut(g,p,prof); return; }
  const mate=teammate(g,p);
  const blocker=laneBlocked(g,p);
  const press=pressureCoef(g,p.x,p.y);
  const d2goal=dist(p.x,p.y,GOAL.cx,GOAL.y);

  // SHOOT — fire on an opening; from close range force a contested attempt (creates rebounds/action)
  const cleanLook  = !blocker && (press>prof.shootOpen || (d2goal<120 && press>0.3));
  const forceClose = d2goal<92 && press>0.18;     // contested layup even with a defender in front
  if(inAttackZone(g,p) && d2goal<prof.shootRange && (cleanLook||forceClose) && g.shotCd<=0){
    attemptShot(g,p, Math.atan2(GOAL.y-p.y,GOAL.cx-p.x), clamp(d2goal*0.7,60,120));
    g.shotCd=0.55; return;
  }
  // RECYCLE: swing to a more open mate (including backward) when blocked
  if(mate && passLaneOpen(g,p,mate) && p.passCd<=0){
    const better = openScore(g,mate.x,mate.y) > openScore(g,p.x,p.y)+0.06;
    if((blocker && better) || (better && Math.random()<0.06)){ passTo(g,p,mate); p.passCd=0.7; return; }
  }
  // DRIBBLE into space instead of charging the wall
  driveToSpace(g,p,prof,blocker);
  moveToward(p,prof.speed);
}

// carry/pass the ball below the clear line before attacking
function clearOut(g,p,prof){
  const leftRoom = pressureCoef(g, COURT.left+80, p.y), rightRoom = pressureCoef(g, COURT.right-80, p.y);
  const side = rightRoom>=leftRoom ? 1 : -1;
  p.tx=clamp(p.x + side*26, COURT.left+24, COURT.right-24);
  p.ty=CLEAR_LINE_Y + 18;
  moveToward(p, prof.speed);
  // offload to a deeper mate if pressed
  const mate=teammate(g,p);
  if(mate && mate.y>p.y+8 && passLaneOpen(g,p,mate) && p.passCd<=0 && pressureCoef(g,p.x,p.y)<0.45){
    passTo(g,p,mate); p.passCd=0.6;
  }
}

// steer the carrier: drive AROUND a blocker toward the open post, else straight at goal
function driveToSpace(g,p,prof,blocker){
  let tx,ty;
  if(blocker){
    const side=(blocker.x>=p.x)?-1:1;                 // attack the post the defender is NOT on
    tx=GOAL.cx + side*54;
    ty=GOAL.y + 22;
  } else {
    let ax=GOAL.cx-p.x, ay=GOAL.y-p.y; const na=Math.hypot(ax,ay)||1; ax/=na; ay/=na;
    const nd=nearestDefenders(g,p.x,p.y)[0];
    let rx=0,ry=0; if(nd && nd.d<70){ rx=p.x-nd.p.x; ry=p.y-nd.p.y; const m=Math.hypot(rx,ry)||1; rx/=m; ry/=m; }
    tx=p.x+(ax+rx*0.5)*prof.dribbleStep;
    ty=p.y+(ay+ry*0.5)*prof.dribbleStep;
  }
  p.tx=clamp(tx, COURT.left+12, COURT.right-12);
  p.ty=clamp(ty, COURT.top+22,  COURT.bottom-24);
  moveToward(p, prof.speed);
}

// dynamic off-ball: spread wide, oscillate to stay live, shed the marker, make runs
function offBallMove(g,p,holder,prof){
  const t=performance.now()/1000;
  const side = holder ? (holder.x>W/2? -1:1) : (p.x>W/2?-1:1);
  const osc = Math.sin(t*1.1 + p.x*0.03);
  const baseX = GOAL.cx + side*(70 + osc*22);
  const holderY = holder? holder.y : COURT.bottom-80;
  let depth;
  if(prof.ally){
    // offer both forward and drop-back outlets so the player can recycle
    depth = clamp(holderY + osc*30 - 6, COURT.top+50, COURT.bottom-40);
  } else {
    // opponent: alternate holding space and bursting in behind the defense
    const run = Math.sin(t*0.7 + p.x*0.02) > 0.3;
    depth = run ? COURT.top+44 : clamp(holderY-18, COURT.top+70, COURT.bottom-40);
  }
  // while our team is still clearing, drop deep to offer a safe outlet below the line
  if(p.team===g.attacking && !g.cleared){
    depth = clamp((holder?holder.y:CLEAR_LINE_Y)+24, CLEAR_LINE_Y-6, COURT.bottom-30);
  }
  const nd=nearestDefenders(g,p.x,p.y)[0];   // lose the marker
  let rx=0,ry=0; if(nd&&nd.d<66){ rx=p.x-nd.p.x; ry=p.y-nd.p.y; const m=Math.hypot(rx,ry)||1; rx/=m; ry/=m; }
  p.tx=clamp(baseX + rx*42, COURT.left+12, COURT.right-12);
  p.ty=clamp(depth + ry*30, COURT.top+24,  COURT.bottom-24);
  moveToward(p, prof.offSpeed);
}

function recoverLoose(g,p){
  const flip = (p.team!==g.attacking);
  gainPossession(g,p);
  spark(g, p.x, p.y, flip ? (p.team==='A'?C.coral:C.blue) : '#fff');
  if(p.isHuman) haptic([15]);
}

function aiDefense(g,p,dt,diff){
  const holder=g.ball.owner, mate=teammate(g,p);

  // opponent has not cleared yet → retreat and set the defensive shape (give them room)
  if(!g.cleared){
    const isFirst = (p===g.players.find(q=>q.role==='def'));
    p.tx=clamp(holder?holder.x:GOAL.cx, COURT.left+34, COURT.right-34);
    p.ty=COURT.top + 74 + (isFirst?0:30);
    moveToward(p, diff.speed*0.9); return;
  }
  if(!holder) return;

  const otherDef=g.players.find(q=>q.role==='def'&&q!==p);
  const iAmNearest=!otherDef || dist(p.x,p.y,holder.x,holder.y)<=dist(otherDef.x,otherDef.y,holder.x,holder.y);
  if(iAmNearest){
    // contain: stand off goal-side (not glued), poke the ball only when it's right there
    const a=Math.atan2(GOAL.y-holder.y, GOAL.cx-holder.x);
    p.tx=clamp(holder.x+Math.cos(a)*24, COURT.left, COURT.right);
    p.ty=clamp(holder.y+Math.sin(a)*24, COURT.top+18, COURT.bottom);
    moveToward(p, diff.speed);
    if(dist(p.x,p.y,holder.x,holder.y) < p.r+holder.r+2 && p.stealCd<=0){
      p.stealCd=0.55;                                   // cap to ~2 pokes/sec
      if(Math.random() < diff.steal*4 + diff.react*0.01) doSteal(g,p);
    }
  } else {
    // mark the other attacker on the goal side, cutting the passing lane
    const tgt=g.players.find(q=>q.team===holder.team && q!==holder) || holder;
    p.tx=clamp(tgt.x*0.5+GOAL.cx*0.5, COURT.left, COURT.right);
    p.ty=clamp(tgt.y-20, COURT.top+20, COURT.bottom);
    moveToward(p, diff.speed*0.95);
  }
}

// ---------- Ball physics / resolution ----------
function pushTrail(b){ b.trail.push({x:b.x,y:b.y}); if(b.trail.length>9) b.trail.shift(); }

function updateBall(g, dt){
  const b=g.ball;
  if(b.owner){ positionBallToOwner(g); b.spin+=0.25; if(b.trail.length) b.trail.length=0; return; }

  if(b.flying==='pass'){
    b.x+=b.vx; b.y+=b.vy; b.spin+=0.4; pushTrail(b);
    const tgt=b._passTarget;
    if(tgt && dist(b.x,b.y,tgt.x,tgt.y) < tgt.r+b.r+2){
      b.owner=tgt; b.flying=false; b.vx=b.vy=0; b._passTarget=null; b.trail.length=0;
      return;
    }
    // intercept by an opponent mid-pass → loose ball (scramble decides possession)
    for(const d of g.players){
      if(d.team!==g.attacking && dist(b.x,b.y,d.x,d.y)<d.r+b.r){
        b.loose=true; b.flying=false; b._passTarget=null;
        b.looseT=g.looseLen; b.vx*=0.4; b.vy*=0.4; break;
      }
    }
    keepBallIn(g);
    return;
  }

  if(b.flying===true){
    b.x+=b.vx; b.y+=b.vy; b.spin+=0.6; pushTrail(b);
    if(b.y <= GOAL.y+2){ resolveShot(g); return; }                 // reached goal line
    if(b.x<COURT.left||b.x>COURT.right){ resolveShotMiss(g); }       // wide
    return;
  }

  if(b.loose){
    b.x+=b.vx; b.y+=b.vy; b.vx*=0.9; b.vy*=0.9; b.spin+=0.3;
    keepBallIn(g); pushTrail(b);
    b.looseT-=dt; showLooseBar(b.looseT/g.looseLen);
    // ANY player can win a loose ball — nearest within reach collects it
    let best=null,bd=1e9;
    for(const p of g.players){ const dd=dist(p.x,p.y,b.x,b.y); if(dd<bd){bd=dd;best=p;} }
    if(best && (bd < best.r+b.r+4 || b.looseT<=0)){ recoverLoose(g,best); return; }
    return;
  }
}

function keepBallIn(g){
  const b=g.ball;
  if(b.x<COURT.left+b.r){b.x=COURT.left+b.r; b.vx*=-0.5;}
  if(b.x>COURT.right-b.r){b.x=COURT.right-b.r; b.vx*=-0.5;}
  if(b.y>COURT.bottom-b.r){b.y=COURT.bottom-b.r; b.vy*=-0.5;}
  if(b.y<COURT.top+b.r){b.y=COURT.top+b.r; b.vy*=-0.5;}
}

function resolveShot(g){
  const b=g.ball, pend=b._pending||{outcome:'miss',team:g.attacking};
  const inGoal = b.x>GOAL.left && b.x<GOAL.right;
  b._pending=null; b.flying=false; b.trail.length=0;
  if(pend.outcome==='goal' && inGoal){ scoreGoal(g, pend.team); return; }
  if(pend.outcome==='save'){ Audio.save(); flashToast('SAVE!', '#fff'); }
  else { Audio.miss(); flashToast('빗나감', '#9CA3AF'); }
  awardRebound(g);
}
function resolveShotMiss(g){
  g.ball.flying=false; g.ball._pending=null; g.ball.trail.length=0;
  Audio.miss(); flashToast('빗나감', '#9CA3AF');
  awardRebound(g);
}

// after a save/miss the DEFENDING team collects the rebound and must clear it out
function awardRebound(g){
  const def = g.attacking==='A'?'B':'A';
  const taker = g.players.filter(p=>p.team===def)
    .sort((a,c)=>dist(a.x,a.y,GOAL.cx,GOAL.y)-dist(c.x,c.y,GOAL.cx,GOAL.y))[0];
  g.ball.x=GOAL.cx; g.ball.y=COURT.top+46;
  if(taker) gainPossession(g, taker, {forceClear:true});
}

function scoreGoal(g, team){
  g.score[team]++;
  updateScoreUI(g);
  g.state=GS.GOAL_CELEB; g.goalLock=1.7;
  g.shake=15; g.flash=0.25;
  const col = team==='A'?C.coral:C.blue;
  burst(g, GOAL.cx, GOAL.y+10, col);
  flashToast('GOAL!', col);
  Audio.goal();
  haptic([60,40,80]);
  g._concede = team==='A'?'B':'A';     // conceding team restarts (comeback chance)
}

// restart after a goal: reset formation, give ball to the conceding team, force a clear
function restartAfterGoal(g){
  setupPlayers(g);
  const concede = g._concede || 'B';
  const taker = g.players.find(p=>p.team===concede);
  if(taker) gainPossession(g, taker, {forceClear:true});
  g.state=GS.PLAY;
}

// ---------- Particles ----------
function burst(g,x,y,color){
  const cols=[color,'#fff',C.yellow];
  for(let i=0;i<46;i++){
    const a=Math.random()*Math.PI*2, sp=2+Math.random()*5;
    g.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,
      life:1, rot:Math.random()*6, vr:(Math.random()-.5)*.4,
      w:4+Math.random()*5, h:6+Math.random()*7,
      col:cols[(Math.random()*cols.length)|0]});
  }
}
// small quick spark (tackle / loose-ball win) — fewer, faster, no gravity
function spark(g,x,y,color){
  const cols=[color,'#fff'];
  for(let i=0;i<14;i++){
    const a=Math.random()*Math.PI*2, sp=2.5+Math.random()*4;
    g.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:0.7, rot:Math.random()*6, vr:(Math.random()-.5)*.6,
      w:3+Math.random()*3, h:3+Math.random()*3, grav:0.02,
      col:cols[(Math.random()*cols.length)|0]});
  }
}
function updateParticles(g,dt){
  for(const p of g.particles){
    p.x+=p.vx; p.y+=p.vy; p.vy+=(p.grav!=null?p.grav:0.14); p.vx*=0.99; p.rot+=p.vr; p.life-=dt*(p.grav!=null?1.3:0.7);
  }
  g.particles=g.particles.filter(p=>p.life>0);
}

// =========================================================================
// RENDER
// =========================================================================
function render(g){
  ctx.save();
  // screen shake
  if(g.shake>0){ ctx.translate((Math.random()-.5)*g.shake,(Math.random()-.5)*g.shake); }

  drawCourt(g);
  drawClearLine(g);
  drawGoal(g);
  // players sorted by y for layered paper feel
  const ps=[...g.players].sort((a,b)=>a.y-b.y);
  for(const p of ps) drawPlayer(g,p);
  drawBall(g);
  drawParticles(g);

  ctx.restore();

  // white flash on goal / reset
  if(g.flash>0){
    ctx.fillStyle=`rgba(255,255,255,${g.flash})`;
    ctx.fillRect(0,0,W,H);
  }
  // urgency court glow
  drawUrgencyEdge(g);
}

function drawCourt(g){
  // grass: vertical gradient (brighter near goal) + mow stripes
  ctx.fillStyle='#256B4D'; ctx.fillRect(0,0,W,H);
  const gg=ctx.createLinearGradient(0,COURT.top,0,COURT.bottom);
  gg.addColorStop(0,'#338A63'); gg.addColorStop(1,'#236247');
  ctx.fillStyle=gg; ctx.fillRect(0,0,W,H);
  const sH=(COURT.bottom-COURT.top)/7;
  for(let i=0;i<7;i++){ ctx.fillStyle=i%2?'rgba(255,255,255,.04)':'rgba(0,0,0,.05)';
    ctx.fillRect(COURT.left,COURT.top+i*sH,COURT.right-COURT.left,sH+0.5); }
  // vignette for depth
  const vg=ctx.createRadialGradient(W/2,H*0.44,H*0.18, W/2,H*0.5,H*0.74);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.30)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  // lines
  ctx.strokeStyle=C.line; ctx.lineWidth=2; ctx.lineJoin='round';
  rr(COURT.left,COURT.top,COURT.right-COURT.left,COURT.bottom-COURT.top,6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(COURT.left,COURT.bottom); ctx.lineTo(COURT.right,COURT.bottom); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2,COURT.bottom,46,Math.PI,2*Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2,COURT.bottom,3,0,7); ctx.fillStyle=C.line; ctx.fill();
  ctx.strokeStyle=C.line;
  ctx.strokeRect(PEN_AREA.left,PEN_AREA.top,PEN_AREA.right-PEN_AREA.left,PEN_AREA.bottom-PEN_AREA.top);
  ctx.strokeRect(PEN_BOX.left,PEN_BOX.top,PEN_BOX.right-PEN_BOX.left,PEN_BOX.bottom-PEN_BOX.top);
  ctx.beginPath(); ctx.arc(GOAL.cx,PEN_AREA.bottom-8,40,0.18*Math.PI,0.82*Math.PI); ctx.stroke();
  // penalty spot
  ctx.beginPath(); ctx.arc(GOAL.cx, PEN_BOX.bottom-2, 2.5, 0, 7); ctx.fillStyle=C.line; ctx.fill();

  // shoot-zone shading when human has the ball but can't shoot yet
  const h=human(g);
  if(g.state===GS.PLAY && h && g.ball.owner===h && g.cleared && (!inAttackZone(g,h)||g.shotCd>0)){
    ctx.fillStyle='rgba(0,0,0,0.08)';
    ctx.fillRect(COURT.left,COURT.top,COURT.right-COURT.left,(COURT.bottom-COURT.top)*0.62);
  }
}

function hexA(h,a){ const n=parseInt(h.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }

function drawClearLine(g){
  const y=CLEAR_LINE_Y;
  ctx.save();
  ctx.strokeStyle='rgba(245,239,224,.45)'; ctx.lineWidth=2; ctx.setLineDash([8,7]);
  ctx.beginPath(); ctx.moveTo(COURT.left,y); ctx.lineTo(COURT.right,y); ctx.stroke();
  ctx.setLineDash([]);
  if(g.state===GS.PLAY && !g.cleared){
    const col = g.attacking==='A'?C.coral:C.blue;
    const grd=ctx.createLinearGradient(0,y,0,COURT.bottom);
    grd.addColorStop(0, hexA(col,0)); grd.addColorStop(1, hexA(col,0.24));
    ctx.fillStyle=grd; ctx.fillRect(COURT.left,y,COURT.right-COURT.left,COURT.bottom-y);
    if(g.attacking==='A'){
      ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font='700 11px "SUIT Variable",sans-serif'; ctx.textAlign='center';
      ctx.fillText('↓ 공을 여기로 빼서 클리어 ↓', W/2, y+(COURT.bottom-y)/2+4);
    }
  }
  ctx.restore();
}

function drawGoal(g){
  const gl=GOAL.left, gr=GOAL.right, gy=GOAL.y, depth=16;
  ctx.save();
  // net panel
  ctx.fillStyle='rgba(245,239,224,.10)'; ctx.fillRect(gl,gy-depth,gr-gl,depth);
  // diagonal mesh
  ctx.strokeStyle='rgba(245,239,224,.22)'; ctx.lineWidth=1;
  for(let x=gl;x<=gr+depth;x+=7){ ctx.beginPath(); ctx.moveTo(x,gy); ctx.lineTo(x-depth,gy-depth); ctx.stroke(); }
  for(let x=gl-depth;x<=gr;x+=7){ ctx.beginPath(); ctx.moveTo(x,gy); ctx.lineTo(x+depth,gy-depth); ctx.stroke(); }
  // posts + crossbar
  ctx.strokeStyle='#F7F2E6'; ctx.lineWidth=4; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(gl,gy); ctx.lineTo(gl,gy-depth); ctx.lineTo(gr,gy-depth); ctx.lineTo(gr,gy); ctx.stroke();
  ctx.restore();
}

function groundShadow(x,y,rx,ry){
  ctx.save(); ctx.fillStyle='rgba(0,0,0,.22)';
  ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,7); ctx.fill(); ctx.restore();
}

function drawPlayer(g,p){
  const base=p.team==='A'?C.coral:C.blue, dk=p.team==='A'?C.coralDk:C.blueDk;
  const lean=clamp((p.tx-p.x)*0.05,-3.2,3.2);
  // ground shadow
  groundShadow(p.x, p.y+p.r+4, p.r+2, (p.r+2)*0.4);
  // ball-owner soft glow
  if(g.ball.owner===p){ ctx.save(); ctx.fillStyle=hexA(base,0.22);
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r+9,0,7); ctx.fill(); ctx.restore(); }
  // body (vertical gradient)
  const bg=ctx.createLinearGradient(0,p.y-p.r,0,p.y+p.r);
  bg.addColorStop(0,base); bg.addColorStop(1,dk);
  ctx.fillStyle=bg; rr(p.x-p.r+lean, p.y-p.r+3, p.r*2, p.r*2+2, 7); ctx.fill();
  // top highlight
  ctx.fillStyle='rgba(255,255,255,.14)'; rr(p.x-p.r+lean, p.y-p.r+3, p.r*2, 6, 6); ctx.fill();
  // head
  ctx.fillStyle=C.skin; ctx.beginPath(); ctx.arc(p.x+lean, p.y-p.r-3, 7,0,7); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.10)'; ctx.beginPath(); ctx.arc(p.x+lean, p.y-p.r-5, 7, Math.PI, 2*Math.PI); ctx.fill();
  // human marker: yellow ring + chevron above
  if(p.isHuman){
    ctx.strokeStyle=C.yellow; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(p.x,p.y+2,p.r+7,0,7); ctx.stroke();
    ctx.fillStyle=C.yellow; ctx.beginPath();
    ctx.moveTo(p.x,p.y-p.r-15); ctx.lineTo(p.x-4,p.y-p.r-21); ctx.lineTo(p.x+4,p.y-p.r-21);
    ctx.closePath(); ctx.fill();
  }
}

function drawBall(g){
  const b=g.ball;
  if(b.trail.length>1){
    for(let i=0;i<b.trail.length;i++){ const t=b.trail[i], f=(i+1)/b.trail.length;
      ctx.globalAlpha=f*0.28; ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(t.x,t.y,b.r*f*0.8,0,7); ctx.fill(); }
    ctx.globalAlpha=1;
  }
  groundShadow(b.x, b.y+b.r+2, b.r*1.05, b.r*0.5);
  const bg=ctx.createRadialGradient(b.x-3,b.y-3,1,b.x,b.y,b.r);
  bg.addColorStop(0,'#ffffff'); bg.addColorStop(1,'#D7DCE4');
  ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();
  ctx.strokeStyle='rgba(31,41,55,.25)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.stroke();
  // rotating pentagon
  ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.spin); ctx.fillStyle='rgba(31,41,55,.85)';
  ctx.beginPath();
  for(let i=0;i<5;i++){ const a=-Math.PI/2+i*2*Math.PI/5, rr2=b.r*0.46;
    const x=Math.cos(a)*rr2, y=Math.sin(a)*rr2; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawParticles(g){
  for(const p of g.particles){
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.globalAlpha=clamp(p.life,0,1);
    ctx.fillStyle=p.col; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

function drawUrgencyEdge(g){
  if(g.state!==GS.PLAY && g.state!==GS.GOAL_CELEB) return;
  const t=g.time;
  let col=null, a=0;
  if(t<=10){ col=C.danger; a=0.5+0.4*Math.sin(performance.now()/120); }
  else if(t<=30){ col='#FF9D3F'; a=0.32; }
  if(col){
    ctx.save(); ctx.globalAlpha=clamp(a,0,1);
    ctx.strokeStyle=col; ctx.lineWidth=8;
    ctx.strokeRect(4,4,W-8,H-8);
    ctx.restore();
  }
}

// rounded rect path
function rr(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// =========================================================================
// AUDIO — Web Audio API procedural (GDD §7.2)
// =========================================================================
const Audio = (()=>{
  let ac=null, drumTimer=null, bpm=100;
  function ctxx(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ac; }
  function resume(){ const a=ctxx(); if(a&&a.state==='suspended') a.resume(); }
  function tone(freq,dur,type='sine',gain=0.2,slideTo=null){
    const a=ctxx(); if(!a) return; const t=a.currentTime;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur);
  }
  function noise(dur,gain=0.3){
    const a=ctxx(); if(!a) return; const t=a.currentTime;
    const n=Math.floor(a.sampleRate*dur); const buf=a.createBuffer(1,n,a.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const s=a.createBufferSource(); s.buffer=buf;
    const g=a.createGain(); g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1800;
    s.connect(f).connect(g).connect(a.destination); s.start(t);
  }
  return {
    resume,
    kick(){ noise(0.08,0.35); tone(140,0.1,'square',0.18,80); },
    pass(){ /* GDD: 패스 = 무진동, 음 약하게 */ tone(420,0.05,'sine',0.06); },
    save(){ noise(0.12,0.25); tone(220,0.12,'sawtooth',0.12,160); },
    miss(){ tone(300,0.18,'sine',0.12,180); },
    goal(){ const seq=[523,659,784,1046]; seq.forEach((f,i)=>setTimeout(()=>tone(f,0.18,'triangle',0.22),i*90));
            setTimeout(()=>tone(1318,0.4,'triangle',0.2),seq.length*90); },
    whistle(){ tone(2400,0.35,'sine',0.18,2800); },
    whistleShort(){ tone(2600,0.12,'sine',0.14,2400); },
    setBpm(v){ bpm=v; },
    startDrum(){ stopDrum(); const step=()=>{ const iv=60/bpm/2; noise(0.03,0.05); tone(70,0.05,'sine',0.08);
        drumTimer=setTimeout(step,iv*1000); }; step(); },
    stopDrum(){ stopDrum(); },
  };
  function stopDrum(){ if(drumTimer){ clearTimeout(drumTimer); drumTimer=null; } }
})();
function haptic(pattern){ if(pattern && navigator.vibrate) navigator.vibrate(pattern); }

// =========================================================================
// UI helpers
// =========================================================================
const $=id=>document.getElementById(id);
function updateScoreUI(g){ $('scoreA').textContent=g.score.A; $('scoreB').textContent=g.score.B; }
function fmtTime(s){ s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function updateHUD(g){
  $('timer').textContent=fmtTime(g.time);
  const tEl=$('timer');
  tEl.style.color = g.time<=10?'#EF4444': g.time<=30?'#FF9D3F':'#fff';
  const ph=$('phase'), b=g.ball;
  let txt, col;
  if(b.loose){ txt='⚡ 루스볼'; col='rgba(239,68,68,.6)'; }
  else if(g.attacking==='A'){ txt=g.cleared?'● 공격':'↓ 클리어'; col='rgba(255,107,94,.55)'; }
  else { txt=g.cleared?'● 수비':'수비 준비'; col='rgba(74,125,255,.55)'; }
  ph.textContent=txt; ph.style.background=col;
}
function showLooseBar(frac){ const b=$('loose-bar'); b.style.display='block';
  $('loose-fill').style.transform='scaleX('+clamp(frac,0,1)+')'; }
function hideLooseBar(){ $('loose-bar').style.display='none'; }

function flashToast(text,color){
  const t=$('toast'); t.textContent=text; t.style.color=color;
  t.style.transition='none'; t.style.opacity='0'; t.style.transform='translate(-50%,-50%) scale(.5)';
  requestAnimationFrame(()=>{ t.style.transition='all .3s cubic-bezier(.2,1.4,.4,1)';
    t.style.opacity='1'; t.style.transform='translate(-50%,-50%) scale(1)';
    setTimeout(()=>{ t.style.transition='all .4s'; t.style.opacity='0'; }, 750); });
}

let lastCount=0;
function updateCountdownOverlay(g){
  const el=$('count-big');
  if((g.state===GS.PLAY) && g.time<=5 && g.time>0){
    const n=Math.ceil(g.time); el.style.display='flex'; el.textContent=n;
    if(n!==lastCount){ lastCount=n; el.style.animation='none'; void el.offsetWidth;
      el.style.animation='pop .5s ease'; if(navigator.vibrate)haptic([15]); }
  } else { el.style.display='none'; lastCount=0; }
}
// inject pop keyframes
const styleEl=document.createElement('style');
styleEl.textContent='@keyframes pop{0%{transform:scale(2);opacity:0}30%{opacity:1}100%{transform:scale(1);opacity:.92}}';
document.head.appendChild(styleEl);

// =========================================================================
// MATCH FLOW
// =========================================================================
let selSec=60;
$('seg-time').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  [...$('seg-time').children].forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); selSec=+b.dataset.sec; Audio.resume();
});
$('btn-start').onclick=()=>startMatch();
$('btn-replay').onclick=()=>startMatch();
$('btn-menu').onclick=()=>{ $('ov-result').classList.add('hidden'); $('ov-title').classList.remove('hidden'); };

function hideOverlays(){ $('ov-title').classList.add('hidden'); $('ov-half').classList.add('hidden'); $('ov-result').classList.add('hidden'); }

function startMatch(){
  Audio.resume();
  game=newMatch(selSec);
  game.time=selSec; game.shotCd=0;
  setupPlayers(game);           // sets attacking=A, cleared=true, ball to A
  game.state=GS.PLAY;
  updateScoreUI(game); updateHUD(game);
  hideOverlays();
  $('hint').textContent='탭=이동 · 스와이프↑=슛 · 동료 탭=패스 · 수비 땐 근접해서 탭=태클';
  $('hint').style.opacity='1';
  Audio.setBpm(100); Audio.startDrum(); Audio.whistle();
  setTimeout(()=>{ if(game) $('hint').style.opacity='0'; }, 5200);
}

function goResult(){
  game.state=GS.RESULT;
  Audio.stopDrum(); Audio.whistle();
  const a=game.score.A, b=game.score.B;
  $('resA').textContent=a; $('resB').textContent=b;
  const title=$('result-title');
  if(a>b){ title.textContent='🏆 승리!'; title.style.color=C.coral; burst(game,W/2,H/2,C.coral); }
  else if(a<b){ title.textContent='패배'; title.style.color=C.blue; }
  else { title.textContent='무승부'; title.style.color='#fff'; }
  $('ov-result').classList.remove('hidden');
}

// =========================================================================
// MAIN LOOP
// =========================================================================
let lastT=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  if(game){
    // decay timers
    game.shake*=0.86; if(game.shake<0.3)game.shake=0;
    game.flash*=0.88; if(game.flash<0.01)game.flash=0;
    if(game.clearFx>0) game.clearFx-=dt;
    if(game.manualT>0) game.manualT-=dt;
    if(game.shotCd>0) game.shotCd-=dt;

    if(game.state===GS.PLAY){
      game.time-=dt;
      // urgency bpm
      const prog=1-game.time/game.halfSec;
      Audio.setBpm(100 + prog*40);
      updateControl(game);            // who the human is steering (carrier / nearest defender)
      updateAI(game,dt);
      // human movement
      const me=human(game); if(me) moveToward(me, 2.25);
      updateBall(game,dt);
      updateClear(game);              // did the attacking team clear the ball?
      updateParticles(game,dt);
      if(game.time<=0){ game.time=0; goResult(); }
    } else if(game.state===GS.GOAL_CELEB){
      game.goalLock-=dt; updateParticles(game,dt);
      if(game.goalLock<=0){ restartAfterGoal(game); }
    } else {
      updateParticles(game,dt);
    }
    updateHUD(game);
    updateCountdownOverlay(game);
    render(game);
  }
  requestAnimationFrame(loop);
}

// boot: draw title court behind overlay
game=newMatch(selSec); setupPlayers(game); game.state=GS.TITLE;
requestAnimationFrame(loop);
</script>
