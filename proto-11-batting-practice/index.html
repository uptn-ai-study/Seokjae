<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#87CEEB">
<title>⚾ BATTING PRACTICE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/variable/SUIT-Variable.min.css">
<style>
:root {
  --primary:       #5F46FF;
  --primary-dark:  #4A35E0;
  --primary-light: #EEEAFF;
  --primary-200:   #F2F0FF;
  --card-bg:       #FFFFFF;
  --muted-bg:      #F5F5F8;
  --border:        #E5E7EB;
  --text-1:        #111827;
  --text-2:        #6B7280;
  --text-3:        #9CA3AF;
  --success:       #10B981;
  --error:         #EF4444;

  --at-sky:     #87CEEB;
  --at-grass:   #4CAF50;
  --at-dirt:    #C8A96E;
  --at-yellow:  #FFD700;
  --at-pink:    #FF6B9D;
  --at-cyan:    #00E5FF;
  --at-outline: #2D2D2D;
  --at-white:   #FAFAF0;
  --at-red:     #FF4444;
  --at-blue:    #4488FF;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'SUIT Variable', 'SUIT', -apple-system, sans-serif;
  background: var(--at-sky);
  height: 100dvh;
  overflow: hidden;
  touch-action: none;
  user-select: none;
}

.screen { display: none; width: 100%; height: 100dvh; }
.screen.active { display: flex; flex-direction: column; }

/* ══ S1: 설정 ══ */
#s1 {
  background: var(--at-sky);
  align-items: center; justify-content: center;
  padding: 20px; gap: 0;
  position: relative; overflow: hidden;
}
.sky-clouds { position: absolute; inset: 0; pointer-events: none; }
.cloud {
  position: absolute; background: white;
  border-radius: 50px; opacity: 0.85;
  border: 2px solid rgba(0,0,0,0.06);
}
.cloud::before,.cloud::after { content:''; position:absolute; background:white; border-radius:50%; }
.cloud1 { width:90px;height:30px;top:8%;left:5%;animation:floatCloud 18s linear infinite; }
.cloud1::before{width:40px;height:40px;top:-20px;left:10px;}
.cloud1::after{width:30px;height:30px;top:-12px;left:35px;}
.cloud2 { width:120px;height:35px;top:18%;right:8%;animation:floatCloud 24s linear infinite reverse; }
.cloud2::before{width:50px;height:50px;top:-25px;left:15px;}
.cloud2::after{width:35px;height:35px;top:-15px;left:55px;}
.cloud3 { width:80px;height:28px;top:35%;left:60%;animation:floatCloud 20s linear infinite; }
.cloud3::before{width:35px;height:35px;top:-18px;left:8px;}
.cloud3::after{width:28px;height:28px;top:-10px;left:32px;}
@keyframes floatCloud {
  0%,100%{transform:translateX(0);}
  50%{transform:translateX(20px);}
}

.s1-title {
  font-size: 36px; font-weight: 700; letter-spacing: -0.5px;
  color: var(--at-outline);
  text-shadow: 3px 3px 0 rgba(255,255,255,0.6), -1px -1px 0 rgba(0,0,0,0.1);
  margin-bottom: 24px; position: relative; z-index: 1; text-align: center;
}
.s1-card {
  background: var(--card-bg); border-radius: 20px;
  border: 3px solid var(--at-outline);
  box-shadow: 5px 5px 0 var(--at-outline);
  padding: 24px 20px; width: 100%; max-width: 400px;
  position: relative; z-index: 1;
  display: flex; flex-direction: column; gap: 24px;
}
.setting-label {
  font-size: 12px; font-weight: 700; color: var(--text-2);
  letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 10px;
}
.speed-display { display:flex; align-items:baseline; gap:4px; margin-bottom:10px; }
.speed-num { font-size: 36px; font-weight: 800; color: var(--at-outline); }
.speed-unit { font-size: 14px; font-weight: 600; color: var(--text-2); }
input[type=range] {
  -webkit-appearance: none;
  width: 100%; height: 8px;
  background: linear-gradient(to right, var(--primary) 0%, var(--primary) var(--pct,50%), #E5E7EB var(--pct,50%), #E5E7EB 100%);
  border-radius: 4px; outline: none; border: 2px solid var(--at-outline);
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--primary); border: 3px solid var(--at-outline);
  cursor: pointer; box-shadow: 2px 2px 0 var(--at-outline);
}
.pitch-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 2px solid var(--at-outline); color: var(--text-2);
  font-size: 13px; font-weight: 600; border-radius: 9999px;
  padding: 6px 14px; background: var(--muted-bg); cursor: pointer;
  font-family: inherit; transition: all 0.12s;
}
.chip.active {
  background: var(--primary); color: white;
  box-shadow: 2px 2px 0 var(--at-outline);
}
.coin-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--muted-bg); border-radius: 12px;
  border: 2px solid var(--border); padding: 14px 16px;
}
.coin-text { font-size: 14px; font-weight: 600; color: var(--text-1); }
.btn-primary {
  width: 100%; height: 56px;
  background: var(--primary); color: white;
  font-size: 16px; font-weight: 700; letter-spacing: -0.3px;
  border-radius: 12px; border: 3px solid var(--at-outline);
  cursor: pointer; box-shadow: 3px 3px 0 var(--at-outline);
  font-family: inherit; transition: transform 0.1s, box-shadow 0.1s;
}
.btn-primary:active {
  background: var(--primary-dark);
  transform: translate(2px,2px);
  box-shadow: 1px 1px 0 var(--at-outline);
}

/* ══ S2: 배팅 ══ */
#s2 { background: #1a1a2e; flex-direction: column; }
.hud {
  height: 72px; background: rgba(30,30,50,0.96);
  display: flex; align-items: center; padding: 0 14px; gap: 10px;
  flex-shrink: 0; border-bottom: 2px solid rgba(255,255,255,0.08);
}
.hud-balls { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; align-items: center; }
.hud-ball { font-size: 16px; transition: opacity 0.3s; }
.hud-ball.used { opacity: 0.2; filter: grayscale(1); }
.hud-speed { text-align: center; }
.hud-speed-num { font-size: 26px; font-weight: 800; color: white; line-height: 1; }
.hud-speed-unit { font-size: 10px; color: rgba(255,255,255,0.5); }
.hud-pitch-badge {
  background: var(--primary); color: white;
  font-size: 12px; font-weight: 700;
  padding: 4px 10px; border-radius: 6px;
  border: 2px solid rgba(255,255,255,0.15); white-space: nowrap;
}
#game-canvas { flex: 1; display: block; cursor: crosshair; touch-action: none; }
.result-bar {
  height: 60px; background: rgba(15,15,28,0.97);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; border-top: 2px solid rgba(255,255,255,0.06);
}
.result-text {
  font-size: 24px; font-weight: 800; letter-spacing: -0.5px;
  opacity: 0; transition: opacity 0.12s;
}
.result-text.show { opacity: 1; }
.result-text.t-strike { color: #FF4444; }
.result-text.t-ball   { color: #4488FF; }
.result-text.t-hit    { color: #FFD700; }
.result-text.t-foul   { color: #FF8C00; }
.result-text.t-miss   { color: #FF6B9D; }
@keyframes shake {
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-5px);}
  40%{transform:translateX(5px);}
  60%{transform:translateX(-3px);}
  80%{transform:translateX(3px);}
}
.result-text.shake { animation: shake 0.35s ease; }
@keyframes pulse {
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.18);}
}
.result-text.pulse { animation: pulse 0.45s ease; }

/* ══ S3: 타구 결과 ══ */
#s3 { background: var(--at-sky); align-items: center; }
.s3-header { width:100%; padding:20px 20px 10px; text-align:center; }
.s3-header h2 { font-size:20px; font-weight:800; color:var(--at-outline); }
.s3-subtitle { font-size:26px; font-weight:800; color:var(--primary); letter-spacing:-0.5px; margin-top:4px; }
#topview-canvas { width:100%; flex:1; display:block; max-height:44vh; }
.s3-stats {
  width:100%; padding:14px 20px;
  background:white; border-top:3px solid var(--at-outline);
  display:flex; gap:16px;
}
.s3-stat { display:flex; flex-direction:column; flex:1; }
.s3-stat-label { font-size:11px; color:var(--text-2); font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
.s3-stat-value { font-size:20px; font-weight:800; color:var(--at-outline); margin-top:2px; }
.s3-buttons { width:100%; padding:12px 20px 24px; display:flex; gap:10px; background:white; }
.btn-primary-md {
  flex:1; height:48px; background:var(--primary); color:white;
  font-size:15px; font-weight:700; letter-spacing:-0.3px;
  border-radius:12px; border:2px solid var(--at-outline);
  cursor:pointer; box-shadow:2px 2px 0 var(--at-outline); font-family:inherit;
}
.btn-secondary {
  flex:1; height:48px; background:var(--primary-200); color:var(--primary);
  font-size:15px; font-weight:700; letter-spacing:-0.3px;
  border-radius:12px; border:2px solid var(--at-outline);
  cursor:pointer; font-family:inherit;
}

/* ══ S4: 세션 종료 ══ */
#s4 {
  background: var(--at-sky);
  align-items: center; justify-content: center;
  padding: 20px; gap: 14px; overflow-y: auto;
}
.s4-title { font-size:30px; font-weight:800; color:var(--at-outline); text-shadow:2px 2px 0 rgba(255,255,255,0.5); }
.s4-card {
  background:var(--card-bg); border-radius:20px;
  border:3px solid var(--at-outline); box-shadow:5px 5px 0 var(--at-outline);
  padding:20px; width:100%; max-width:400px;
}
.s4-avg { font-size:48px; font-weight:800; color:var(--primary); text-align:center; letter-spacing:-1px; line-height:1; margin-bottom:4px; }
.s4-avg-sub { font-size:14px; color:var(--text-2); text-align:center; margin-bottom:18px; }
.stat-row {
  display:flex; align-items:center; justify-content:space-between;
  padding:9px 0; border-bottom:1px solid var(--border);
}
.stat-row:last-child { border-bottom:none; }
.stat-name { font-size:14px; color:var(--text-2); font-weight:500; }
.stat-balls { display:flex; gap:3px; }
.s4-extra { width:100%; max-width:400px; display:flex; flex-direction:column; gap:6px; }
.s4-extra-item {
  background:white; border-radius:12px; border:2px solid var(--border);
  padding:12px 16px; font-size:14px; font-weight:600; color:var(--text-1);
}
.s4-buttons { width:100%; max-width:400px; display:flex; gap:10px; }

/* 파티클 */
.particle-container { position:fixed; inset:0; pointer-events:none; z-index:999; }
.particle {
  position:absolute; width:8px; height:8px; border-radius:50%;
  animation: particleFly 1.1s ease-out forwards;
}
@keyframes particleFly {
  0%{transform:translate(0,0) scale(1); opacity:1;}
  100%{transform:translate(var(--tx),var(--ty)) scale(0); opacity:0;}
}

/* 스윙 힌트 */
.swing-hint {
  position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.45); font-size: 13px; font-weight: 600;
  pointer-events: none; letter-spacing: 0.3px;
  animation: hintPulse 2s infinite;
}
@keyframes hintPulse {
  0%,100%{opacity:0.4;} 50%{opacity:0.9;}
}
</style>
</head>
<body>

<!-- S1: 설정 -->
<div id="s1" class="screen active">
  <div class="sky-clouds">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
  </div>
  <div class="s1-title">⚾ BATTING PRACTICE</div>
  <div class="s1-card">
    <div>
      <div class="setting-label">최고 구속</div>
      <div class="speed-display">
        <span class="speed-num" id="speedVal">130</span>
        <span class="speed-unit">km/h</span>
      </div>
      <input type="range" id="speedSlider" min="100" max="160" value="130">
    </div>
    <div>
      <div class="setting-label">구종 선택</div>
      <div class="pitch-chips" id="pitchChips">
        <button class="chip active" data-pitch="fastball">직구(4-Seam)</button>
        <button class="chip" data-pitch="sinker">투심</button>
        <button class="chip" data-pitch="cutter">커터</button>
        <button class="chip" data-pitch="slider">슬라이더</button>
        <button class="chip" data-pitch="curve">커브</button>
        <button class="chip" data-pitch="changeup">체인지업</button>
        <button class="chip" data-pitch="splitter">스플리터</button>
      </div>
    </div>
    <div>
      <div class="setting-label">타자 설정</div>
      <div class="pitch-chips" id="batterChips">
        <button class="chip active" data-side="right">🏏 우타자</button>
        <button class="chip" data-side="left">🏏 좌타자</button>
      </div>
    </div>
    <div class="coin-row">
      <span style="font-size:20px">🪙</span>
      <span class="coin-text">코인 1개 = 10번의 배팅 기회</span>
    </div>
    <button class="btn-primary" id="startBtn">⚾ 배팅 연습 시작!</button>
  </div>
</div>

<!-- S2: 배팅 -->
<div id="s2" class="screen" style="position:relative">
  <div class="hud">
    <div class="hud-balls" id="hudBalls"></div>
    <div class="hud-speed">
      <div class="hud-speed-num" id="hudSpeedNum">—</div>
      <div class="hud-speed-unit">km/h</div>
    </div>
    <div class="hud-pitch-badge" id="hudPitch">—</div>
  </div>
  <canvas id="game-canvas"></canvas>
  <div class="swing-hint" id="swingHint">탭 또는 클릭으로 스윙!</div>
  <div class="result-bar">
    <div class="result-text" id="resultText"></div>
  </div>
</div>

<!-- S3: 타구 결과 -->
<div id="s3" class="screen">
  <div class="s3-header">
    <h2>🎯 타구 결과</h2>
    <div class="s3-subtitle" id="hitTitle">안타!</div>
  </div>
  <canvas id="topview-canvas"></canvas>
  <div class="s3-stats">
    <div class="s3-stat">
      <div class="s3-stat-label">📏 비거리</div>
      <div class="s3-stat-value" id="hitDistance">—</div>
    </div>
    <div class="s3-stat">
      <div class="s3-stat-label">📍 낙하 지점</div>
      <div class="s3-stat-value" id="hitZone">—</div>
    </div>
    <div class="s3-stat">
      <div class="s3-stat-label">🏏 방향</div>
      <div class="s3-stat-value" id="hitDir">—</div>
    </div>
  </div>
  <div class="s3-buttons">
    <button class="btn-primary-md" id="nextAtBatBtn">다음 타석으로 →</button>
    <button class="btn-secondary" id="showStatsBtn">결과 보기</button>
  </div>
</div>

<!-- S4: 세션 종료 -->
<div id="s4" class="screen">
  <div class="s4-title">🏆 배팅 결과</div>
  <div class="s4-card">
    <div class="s4-avg" id="s4Avg">.000</div>
    <div class="s4-avg-sub" id="s4AvgSub">0안타 / 10타석</div>
    <div id="s4StatRows"></div>
  </div>
  <div class="s4-extra">
    <div class="s4-extra-item" id="s4MaxDist">최장 비거리: — 🚀</div>
    <div class="s4-extra-item" id="s4BestDir">최다 타구 방향: —</div>
  </div>
  <div class="s4-buttons">
    <button class="btn-primary-md" id="replayBtn">🪙 한 판 더!</button>
    <button class="btn-secondary" id="settingsBtn">설정 변경하기</button>
  </div>
</div>

<div class="particle-container" id="particles"></div>

<script>
/* ─────────────────────────────────
   CONFIG & CONSTANTS
───────────────────────────────── */
const PITCH_NAMES = {
  fastball:'직구', sinker:'투심', cutter:'커터',
  slider:'슬라이더', curve:'커브', changeup:'체인지업', splitter:'스플리터',
};
const PITCH_SPEED = {
  fastball:[0.90,1.00], sinker:[0.88,0.98], cutter:[0.85,0.95],
  slider:[0.75,0.85],   curve:[0.65,0.80],  changeup:[0.75,0.85], splitter:[0.80,0.90],
};
const DIR_LABEL = { pull:'당겨치기', center:'센터', oppo:'밀어치기' };
const TOTAL_AB  = 10;

/* ─────────────────────────────────
   STATE
───────────────────────────────── */
let cfg = { maxSpeed: 130, pitches: ['fastball'], batterSide: 'right' };
let session = null;
let pitch   = null;   // current pitch data (null = not in flight)
let rafId   = null;   // animation frame id
let timer1  = null;   // schedule timer 1
let timer2  = null;   // schedule timer 2
let busy    = false;  // true while result is showing / transition in progress
let swingAnim = { progress: null }; // null=대기, 0~1=스윙 중

function clearAll() {
  if (rafId)  { cancelAnimationFrame(rafId); rafId = null; }
  if (timer1) { clearTimeout(timer1); timer1 = null; }
  if (timer2) { clearTimeout(timer2); timer2 = null; }
  pitch = null;
  busy  = false;
  swingAnim.progress = null;
}

function initSession() {
  clearAll();
  session = {
    total: TOTAL_AB,
    current: 0,       // pitches thrown so far
    atbats: 0,        // real at-bats (exclude balls)
    hits: 0,
    maxDist: 0,
    dirCount: {},
    stats: { strike:0, miss:0, ball:0, hit:0, homerun:0, foul:0 },
  };
}

/* ─────────────────────────────────
   SCREEN
───────────────────────────────── */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 's2') {
    resizeCanvas();
    buildHudBalls();
    setHint(true);
    drawField();
    timer1 = setTimeout(throwPitch, 700);
  }
  if (id === 's3') setTimeout(drawTopview, 80);
  if (id === 's4') buildResults();
}

/* ─────────────────────────────────
   S1 LOGIC
───────────────────────────────── */
const speedSlider = document.getElementById('speedSlider');
const speedVal    = document.getElementById('speedVal');

function updateSlider() {
  const pct = ((speedSlider.value - 100) / 60) * 100;
  speedSlider.style.setProperty('--pct', pct + '%');
  speedVal.textContent = speedSlider.value;
  cfg.maxSpeed = +speedSlider.value;
}
speedSlider.addEventListener('input', updateSlider);
updateSlider();

document.getElementById('pitchChips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const actives = document.querySelectorAll('#pitchChips .chip.active');
  if (chip.classList.contains('active') && actives.length === 1) return;
  chip.classList.toggle('active');
  cfg.pitches = [...document.querySelectorAll('#pitchChips .chip.active')].map(c => c.dataset.pitch);
});

document.getElementById('batterChips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('#batterChips .chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  cfg.batterSide = chip.dataset.side;
});

document.getElementById('startBtn').addEventListener('click', () => {
  initSession();
  showScreen('s2');
});

/* ─────────────────────────────────
   CANVAS & FIELD RENDERING
───────────────────────────────── */
const canvas = document.getElementById('game-canvas');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1;

// Strike zone bounds (populated by drawStrikeZone)
const SZ = { x:0, y:0, w:0, h:0 };
// Home plate bounds
const HP = { cx:0, cy:0, w:0, top:0 };

function resizeCanvas() {
  dpr = window.devicePixelRatio || 1;
  const r = canvas.getBoundingClientRect();
  W = r.width; H = r.height;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener('resize', () => {
  if (document.getElementById('s2').classList.contains('active')) { resizeCanvas(); drawField(); }
});

/* 타자 신체 치수 (drawBatter / drawStrikeZone 공유) */
function batterLayout() {
  const isRight = cfg.batterSide !== 'left';
  const batH    = H * 0.52;
  const footY   = H * 0.84;
  const headR   = batH * 0.115;
  return {
    isRight,
    batH, footY, headR,
    headCY   : footY - batH + headR,
    shoulderY: footY - batH * 0.78,
    chestY   : footY - batH * 0.62,   // 스트라이크존 상단 (가슴 레터스 라인)
    waistY   : footY - batH * 0.42,
    kneeY    : footY - batH * 0.22,   // 스트라이크존 하단 (무릎 상단)
    bodyW    : batH * 0.145,
    bx       : isRight ? HP.cx - HP.w * 1.35 : HP.cx + HP.w * 1.35,
  };
}

function drawField(highlightCol = -1, highlightRow = -1) {
  ctx.clearRect(0, 0, W, H);

  /* ── 하늘 그라디언트 ─────────────────────── */
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.40);
  sky.addColorStop(0, '#4A90D9');
  sky.addColorStop(1, '#87CEEB');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H * 0.40);

  /* ── 외야 잔디 ───────────────────────────── */
  ctx.fillStyle = '#3DA550';
  ctx.fillRect(0, H * 0.36, W, H * 0.22);

  /* ── 내야 흙 (원근 사다리꼴) ─────────────── */
  ctx.beginPath();
  ctx.moveTo(W * 0.30, H * 0.42);
  ctx.lineTo(W * 0.70, H * 0.42);
  ctx.lineTo(W * 0.90, H * 0.64);
  ctx.lineTo(W * 0.10, H * 0.64);
  ctx.closePath();
  ctx.fillStyle = '#C8A96E'; ctx.fill();

  /* ── 타석 근경 (카메라 근처 넓은 흙) ─────── */
  ctx.fillStyle = '#C8A96E';
  ctx.fillRect(0, H * 0.62, W, H * 0.38);

  /* 잔디·흙 경계 삼각 보정 */
  ctx.fillStyle = '#3DA550';
  ctx.beginPath(); ctx.moveTo(0, H*0.62); ctx.lineTo(W*0.10, H*0.64); ctx.lineTo(W*0.10, H*0.62); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(W, H*0.62); ctx.lineTo(W*0.90, H*0.64); ctx.lineTo(W*0.90, H*0.62); ctx.closePath(); ctx.fill();

  /* ── 파울 라인 (원근 소실점 방향) ───────── */
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(W*0.10, H*0.64); ctx.lineTo(0,   H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W*0.90, H*0.64); ctx.lineTo(W,   H); ctx.stroke();

  /* ── 투수 마운드 ─────────────────────────── */
  ctx.beginPath(); ctx.ellipse(W/2, H*0.47, 17, 7, 0, 0, Math.PI*2);
  ctx.fillStyle = '#D4A96A'; ctx.fill();
  ctx.strokeStyle = '#2D2D2D'; ctx.lineWidth = 1.5; ctx.stroke();

  /* ── 투수 (배경, 타자보다 먼저 그림) ────── */
  drawPitcher(W / 2, H * 0.41);

  /* ── 홈플레이트 → 스트라이크존 → 타자 ────── */
  drawHomePlate();
  drawStrikeZone(highlightCol, highlightRow);
  drawBatter(swingAnim.progress);
}

function drawPitcher(x, y) {
  /* 원거리 소형 — 타자 대비 약 17% 크기 */
  const s = 2.5;
  /* 몸통 */
  ctx.beginPath(); ctx.ellipse(x, y+8*s, 7*s, 11*s, 0, 0, Math.PI*2);
  ctx.fillStyle = '#3B5BDB'; ctx.fill();
  ctx.strokeStyle = '#2D2D2D'; ctx.lineWidth = 1.5; ctx.stroke();
  /* 머리 */
  ctx.beginPath(); ctx.arc(x, y-3*s, 8*s, 0, Math.PI*2);
  ctx.fillStyle = '#FFD6A5'; ctx.fill(); ctx.stroke();
  /* 모자 */
  ctx.beginPath(); ctx.arc(x, y-6*s, 8*s, Math.PI, 0); ctx.closePath();
  ctx.fillStyle = '#C92A2A'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-8*s, y-6*s); ctx.lineTo(x+13*s, y-6*s);
  ctx.strokeStyle = '#A01010'; ctx.lineWidth = 2; ctx.stroke();
  /* 눈 */
  ctx.fillStyle = '#2D2D2D';
  ctx.beginPath(); ctx.arc(x-2.5*s, y-3*s, 1.2*s, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+2.5*s, y-3*s, 1.2*s, 0, Math.PI*2); ctx.fill();
  /* 투구 팔 + 공 */
  ctx.save(); ctx.strokeStyle = '#3B5BDB'; ctx.lineWidth = 3*s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x+7*s, y+2*s); ctx.lineTo(x+14*s, y-4*s); ctx.stroke();
  ctx.lineCap = 'butt'; ctx.restore();
  ctx.beginPath(); ctx.arc(x+14*s, y-4*s, 3*s, 0, Math.PI*2);
  ctx.fillStyle = '#FAFAF0'; ctx.fill();
  ctx.strokeStyle = '#2D2D2D'; ctx.lineWidth = 1; ctx.stroke();
}

function drawBatter(swingProg) {
  const L = batterLayout();
  const { isRight, batH, footY, headR, headCY, shoulderY, chestY, waistY, kneeY, bodyW, bx } = L;
  const t = swingProg != null ? swingProg : 0;

  /* ── 방망이 ───────────────────────────────────────────────
     포수 시점에서 우타자 오른쪽 옆면이 보임:
       대기  → 배럴이 뒤 어깨 위쪽 (10~11시 방향) = -110°
       스윙  → 시계 방향 → 배럴이 투수 쪽(우하)으로 관통 = +40°
     좌타자: 대기 -70°(1~2시), 반시계 방향 → -220°(=+140°)  */
  const batLen  = batH * 0.64;
  const batW    = Math.max(5, batH * 0.022);
  const handOX  = isRight ? bx + bodyW * 0.55 : bx - bodyW * 0.55;
  const handOY  = chestY + (waistY - chestY) * 0.25;
  const batAngle = isRight
    ? (-Math.PI * 0.611) + t * (Math.PI * 0.833)   // -110° → +40°
    : (-Math.PI * 0.389) - t * (Math.PI * 0.833);  // -70°  → -220°
  const batTipX = handOX + Math.cos(batAngle) * batLen;
  const batTipY = handOY + Math.sin(batAngle) * batLen;

  /* ── 다리 ────────────────────────────────── */
  ctx.save(); ctx.lineCap = 'round';
  /* 앞다리 (근경) */
  ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = bodyW * 0.65;
  ctx.beginPath();
  ctx.moveTo(bx + (isRight ? bodyW*0.42 : -bodyW*0.42), footY);
  ctx.lineTo(bx + (isRight ? bodyW*0.18 : -bodyW*0.18), kneeY);
  ctx.lineTo(bx + (isRight ? bodyW*0.10 : -bodyW*0.10), waistY);
  ctx.stroke();
  /* 뒷다리 (원경, 조금 가늘게) */
  ctx.lineWidth = bodyW * 0.50;
  ctx.beginPath();
  ctx.moveTo(bx - (isRight ? bodyW*0.32 : -bodyW*0.32), footY - 2);
  ctx.lineTo(bx - (isRight ? bodyW*0.12 : -bodyW*0.12), kneeY + 2);
  ctx.lineTo(bx - (isRight ? bodyW*0.06 : -bodyW*0.06), waistY + 2);
  ctx.stroke();
  ctx.lineCap = 'butt'; ctx.restore();

  /* ── 몸통 (사다리꼴) ──────────────────────── */
  ctx.beginPath();
  ctx.moveTo(bx - bodyW,         shoulderY);
  ctx.lineTo(bx + bodyW,         shoulderY);
  ctx.lineTo(bx + bodyW * 0.72,  waistY);
  ctx.lineTo(bx - bodyW * 0.72,  waistY);
  ctx.closePath();
  ctx.fillStyle = '#C92A2A'; ctx.fill();
  ctx.strokeStyle = '#2D2D2D'; ctx.lineWidth = 2; ctx.stroke();
  /* 유니폼 가슴 선 */
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(bx - bodyW*0.45, chestY + 4);
  ctx.lineTo(bx + bodyW*0.45, chestY + 4);
  ctx.stroke();

  /* ── 방망이 (팔보다 먼저 그려서 손이 위에 옴) ── */
  ctx.save(); ctx.lineCap = 'round';
  ctx.strokeStyle = '#6B3410'; ctx.lineWidth = batW;
  ctx.beginPath(); ctx.moveTo(handOX, handOY); ctx.lineTo(batTipX, batTipY); ctx.stroke();
  /* 배럴 끝 강조 */
  ctx.beginPath(); ctx.arc(batTipX, batTipY, batW * 0.75, 0, Math.PI*2);
  ctx.fillStyle = '#A0522D'; ctx.fill();
  /* 손잡이 너브 */
  ctx.beginPath(); ctx.arc(handOX, handOY, batW * 0.95, 0, Math.PI*2);
  ctx.fillStyle = '#4A2010'; ctx.fill();
  ctx.lineCap = 'butt'; ctx.restore();

  /* ── 팔 ──────────────────────────────────── */
  ctx.save(); ctx.lineCap = 'round';
  /* 근경 팔 */
  ctx.strokeStyle = '#C92A2A'; ctx.lineWidth = bodyW * 0.52;
  ctx.beginPath();
  ctx.moveTo(bx + (isRight ?  bodyW*0.88 : -bodyW*0.88), shoulderY + 4);
  ctx.lineTo(handOX, handOY);
  ctx.stroke();
  /* 원경 팔 */
  ctx.lineWidth = bodyW * 0.38;
  ctx.beginPath();
  ctx.moveTo(bx - (isRight ?  bodyW*0.78 : -bodyW*0.78), shoulderY + 6);
  ctx.lineTo(handOX + (isRight ? -5 : 5), handOY + 3);
  ctx.stroke();
  ctx.lineCap = 'butt'; ctx.restore();

  /* 손(글러브 위치) */
  ctx.beginPath(); ctx.arc(handOX, handOY, bodyW * 0.27, 0, Math.PI*2);
  ctx.fillStyle = '#D4A96A'; ctx.fill();
  ctx.strokeStyle = '#2D2D2D'; ctx.lineWidth = 1.5; ctx.stroke();

  /* ── 머리 ────────────────────────────────── */
  ctx.beginPath(); ctx.arc(bx, headCY, headR, 0, Math.PI*2);
  ctx.fillStyle = '#FFD6A5'; ctx.fill();
  ctx.strokeStyle = '#2D2D2D'; ctx.lineWidth = 2; ctx.stroke();

  /* ── 헬멧 ────────────────────────────────── */
  ctx.beginPath();
  ctx.arc(bx, headCY - headR*0.18, headR*1.06, Math.PI*1.08, Math.PI*1.92);
  ctx.closePath();
  ctx.fillStyle = '#1a1a1a'; ctx.fill();
  ctx.strokeStyle = '#2D2D2D'; ctx.lineWidth = 2; ctx.stroke();
  /* 챙 */
  const bd = isRight ? 1 : -1;
  ctx.beginPath();
  ctx.moveTo(bx,                  headCY - headR*0.18);
  ctx.lineTo(bx + bd*headR*1.55,  headCY - headR*0.18);
  ctx.lineTo(bx + bd*headR*1.55,  headCY - headR*0.18 + headR*0.22);
  ctx.lineTo(bx,                  headCY - headR*0.18 + headR*0.22);
  ctx.closePath();
  ctx.fillStyle = '#1a1a1a'; ctx.fill(); ctx.stroke();
  /* 귀마개 */
  ctx.beginPath();
  ctx.arc(bx + bd*headR*0.88, headCY + headR*0.12, headR*0.42, 0, Math.PI*2);
  ctx.fillStyle = '#1a1a1a'; ctx.fill(); ctx.stroke();
}

function drawHomePlate() {
  HP.cx  = W / 2;
  HP.cy  = H - 22;
  HP.w   = Math.min(W * 0.15, 52);
  const h = HP.w * 0.62;
  HP.top = HP.cy - h;
  ctx.beginPath();
  ctx.moveTo(HP.cx,       HP.cy + 3);
  ctx.lineTo(HP.cx - HP.w, HP.top + h*0.4);
  ctx.lineTo(HP.cx - HP.w, HP.top);
  ctx.lineTo(HP.cx + HP.w, HP.top);
  ctx.lineTo(HP.cx + HP.w, HP.top + h*0.4);
  ctx.closePath();
  ctx.fillStyle = '#FAFAF0'; ctx.fill();
  ctx.strokeStyle = '#2D2D2D'; ctx.lineWidth = 3; ctx.stroke();
}

function drawStrikeZone(hCol = -1, hRow = -1) {
  /* 스트라이크존: 타자 가슴(레터스)~무릎 상단 — 야구 규칙 준수 */
  const { chestY, kneeY } = batterLayout();
  SZ.w = HP.w * 2.4;
  SZ.x = HP.cx - SZ.w / 2;
  SZ.y = chestY;
  SZ.h = kneeY - chestY;

  ctx.fillStyle = 'rgba(0,229,255,0.08)';
  ctx.fillRect(SZ.x, SZ.y, SZ.w, SZ.h);

  if (hCol >= 0 && hRow >= 0) {
    const cw = SZ.w/3, ch = SZ.h/3;
    ctx.fillStyle = 'rgba(255,107,157,0.42)';
    ctx.fillRect(SZ.x + hCol*cw + 1, SZ.y + hRow*ch + 1, cw-2, ch-2);
  }

  ctx.strokeStyle = 'rgba(0,229,255,0.65)';
  ctx.lineWidth = 2; ctx.setLineDash([6,4]);
  ctx.strokeRect(SZ.x, SZ.y, SZ.w, SZ.h);
  ctx.setLineDash([]);

  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1;
  for (let i=1;i<3;i++){
    const x = SZ.x+(SZ.w/3)*i;
    ctx.beginPath(); ctx.moveTo(x,SZ.y); ctx.lineTo(x,SZ.y+SZ.h); ctx.stroke();
  }
  for (let i=1;i<3;i++){
    const y = SZ.y+(SZ.h/3)*i;
    ctx.beginPath(); ctx.moveTo(SZ.x,y); ctx.lineTo(SZ.x+SZ.w,y); ctx.stroke();
  }
}

/* ─────────────────────────────────
   HUD
───────────────────────────────── */
function buildHudBalls() {
  const c = document.getElementById('hudBalls');
  c.innerHTML = '';
  for (let i=0;i<TOTAL_AB;i++){
    const d = document.createElement('div');
    d.className = 'hud-ball' + (i < session.current ? ' used' : '');
    d.textContent = '⚾';
    c.appendChild(d);
  }
}

function setHint(show) {
  const h = document.getElementById('swingHint');
  if (h) h.style.display = show ? 'block' : 'none';
}

/* ─────────────────────────────────
   PITCH FLIGHT
───────────────────────────────── */
function rnd(min,max){ return min + Math.random()*(max-min); }

function throwPitch() {
  if (!session || session.current >= session.total) return;

  pitch = null;  // reset before building

  const type  = cfg.pitches[Math.floor(Math.random()*cfg.pitches.length)];
  const r     = PITCH_SPEED[type];
  const speed = Math.round(cfg.maxSpeed * rnd(r[0], r[1]));
  // travel time: faster = shorter (160→400ms, 100→700ms)
  const travelMs = Math.round(700 - ((speed-100)/60)*300);
  // determine if in strike zone (65% chance)
  const inZone = Math.random() < 0.65;

  let destX, destY;
  if (inZone) {
    destX = SZ.x + SZ.w*0.08 + Math.random()*SZ.w*0.84;
    destY = SZ.y + SZ.h*0.08 + Math.random()*SZ.h*0.84;
  } else {
    // 존 경계에서 최대 SZ크기의 30%만 벗어나도록 제한
    const pad  = 10 + Math.random()*18; // 10~28px
    const side = Math.floor(Math.random()*4);
    // y 범위는 존 내부 ±20% 유지 (위로 너무 날지 않도록)
    const safeY1 = SZ.y - SZ.h*0.15;
    const safeY2 = SZ.y + SZ.h*1.15;
    const safeX1 = SZ.x - SZ.w*0.15;
    const safeX2 = SZ.x + SZ.w*1.15;
    if (side===0) {
      destX = SZ.x - pad;
      destY = SZ.y + SZ.h*0.05 + Math.random()*SZ.h*0.9;
    } else if (side===1) {
      destX = SZ.x + SZ.w + pad;
      destY = SZ.y + SZ.h*0.05 + Math.random()*SZ.h*0.9;
    } else if (side===2) {
      destX = SZ.x + SZ.w*0.05 + Math.random()*SZ.w*0.9;
      destY = SZ.y - pad;
    } else {
      destX = SZ.x + SZ.w*0.05 + Math.random()*SZ.w*0.9;
      destY = SZ.y + SZ.h + pad;
    }
  }

  pitch = { type, speed, travelMs, inZone, destX, destY,
            startTime: null, swung: false, judged: false };

  document.getElementById('hudSpeedNum').textContent = speed;
  document.getElementById('hudPitch').textContent    = PITCH_NAMES[type];
  showResult('');
  busy = false;
  setHint(true);

  rafId = requestAnimationFrame(animFrame);
}

/* pitch offsets by type */
function pitchOffset(type, p) {
  switch(type){
    case 'curve':    return { dx: Math.sin(p*Math.PI)*30, dy: -Math.pow(p,1.4)*38 };
    case 'slider':   return { dx: -(1-Math.cos(p*Math.PI/2))*34, dy: 0 };
    case 'changeup': return { dx: 0, dy: Math.pow(p,2)*-20 };
    case 'sinker':   return { dx: Math.sin(p*Math.PI*0.7)*12, dy: Math.pow(p,1.2)*-12 };
    case 'cutter':   return { dx: -(1-Math.cos(p*Math.PI/2))*18, dy: 0 };
    case 'splitter': return { dx: 0, dy: Math.pow(p,1.7)*-44 };
    default:         return { dx: 0, dy: 0 };
  }
}

function animFrame(ts) {
  if (!pitch) return;
  if (!pitch.startTime) pitch.startTime = ts;
  const elapsed  = ts - pitch.startTime;
  const progress = Math.min(elapsed / pitch.travelMs, 1);

  const startX = W/2 + 14*2.5, startY = H*0.41 - 4*2.5; /* 투수 손 위치 */
  const off    = pitchOffset(pitch.type, progress);
  const ballX  = startX + (pitch.destX - startX)*progress + off.dx*progress;
  const ballY  = startY + (pitch.destY - startY)*progress + off.dy;
  const ballR  = 4 + progress*12;

  /* redraw field */
  drawField();

  /* trajectory trail */
  if (progress > 0.06) {
    ctx.save();
    ctx.strokeStyle = 'rgba(0,229,255,0.45)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4,6]);
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    const steps = 18;
    for (let i=1;i<=Math.floor(progress*steps);i++){
      const p2 = i/steps;
      const o2 = pitchOffset(pitch.type, p2);
      ctx.lineTo(startX+(pitch.destX-startX)*p2+o2.dx*p2,
                 startY+(pitch.destY-startY)*p2+o2.dy);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  /* ball */
  ctx.beginPath(); ctx.arc(ballX, ballY, ballR, 0, Math.PI*2);
  ctx.fillStyle = '#FAFAF0'; ctx.fill();
  ctx.strokeStyle = '#2D2D2D'; ctx.lineWidth = 2; ctx.stroke();
  /* seams */
  ctx.strokeStyle = '#CC2222'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(ballX-ballR*0.2, ballY, ballR*0.55, -0.5, 0.5); ctx.stroke();
  ctx.beginPath(); ctx.arc(ballX+ballR*0.2, ballY, ballR*0.55, Math.PI-0.5, Math.PI+0.5); ctx.stroke();

  if (progress < 1) {
    rafId = requestAnimationFrame(animFrame);
  } else {
    /* ball arrived — auto judge if no swing */
    if (!pitch.swung && !pitch.judged) {
      pitch.judged = true;
      autoJudge();
    }
  }
}

/* ─────────────────────────────────
   AUTO JUDGE (no swing)
───────────────────────────────── */
function autoJudge() {
  if (!pitch || busy) return;
  busy = true;
  setHint(false);

  const col = Math.floor((pitch.destX - SZ.x) / (SZ.w/3));
  const row = Math.floor((pitch.destY - SZ.y) / (SZ.h/3));
  const inCell = (col>=0 && col<3 && row>=0 && row<3);

  session.current++;
  buildHudBalls();

  if (pitch.inZone && inCell) {
    session.stats.strike++;
    session.atbats++;
    drawField(col, row);
    showResult('스트라이크! 👀', 't-strike shake');
  } else {
    session.stats.ball++;
    showResult('볼! 🟦', 't-ball');
    // ball: don't count as at-bat, don't count towards session end
    // (re-increment current so it still uses a slot)
  }

  pitch = null;
  scheduleNextPitch();
}

/* ─────────────────────────────────
   SWING
───────────────────────────────── */
function swing(gestureDir) {
  if (!pitch || pitch.swung || pitch.judged || busy) return;
  pitch.swung = true;
  busy = true;
  setHint(false);
  cancelAnimationFrame(rafId); rafId = null;
  startBatterSwing();

  const now  = performance.now();
  const elapsed = pitch.startTime ? now - pitch.startTime : pitch.travelMs;
  const diff    = elapsed - pitch.travelMs;  // negative = early, positive = late
  const absDiff = Math.abs(diff);

  session.current++;
  session.atbats++;
  buildHudBalls();

  /* miss */
  if (absDiff >= 150) {
    session.stats.miss++;
    drawField();
    showResult('스윙 아웃! 💨', 't-miss shake');
    pitch = null;
    scheduleNextPitch();
    return;
  }

  /* zone check for out-of-zone swing */
  if (!pitch.inZone) {
    if (absDiff < 80) {
      session.stats.foul++;
      drawField();
      showResult('파울! 🟠', 't-foul');
    } else {
      session.stats.miss++;
      drawField();
      showResult('스윙 아웃! 💨', 't-miss shake');
    }
    pitch = null;
    scheduleNextPitch();
    return;
  }

  /* HIT */
  const timingScore = 1 - Math.min(absDiff / 150, 1);
  const baseDistance = 60 + (pitch.speed / 160) * 80;
  const distance     = Math.round(baseDistance * (0.5 + timingScore * 0.5));

  /* random foul on bad timing */
  if (absDiff > 100 && Math.random() < 0.38) {
    session.stats.foul++;
    drawField();
    showResult('파울! 🟠', 't-foul');
    pitch = null;
    scheduleNextPitch();
    return;
  }

  /* direction */
  let dir;
  if (gestureDir === 'up'   || diff < -25) dir = 'pull';
  else if (gestureDir === 'down' || diff >  25) dir = 'oppo';
  else dir = 'center';

  session.stats.hit++;
  session.hits++;
  const isHR = distance >= 140;
  if (isHR) session.stats.homerun++;
  if (distance > session.maxDist) session.maxDist = distance;
  session.dirCount[dir] = (session.dirCount[dir]||0) + 1;

  /* store for S3 */
  window._lastHit = { distance, dir };

  drawField();
  const label = isHR ? '홈런! 🎉🚀' : '안타! 💥';
  showResult(label, 't-hit pulse');
  if (isHR) spawnParticles();
  pitch = null;

  /* go to S3 */
  timer1 = setTimeout(() => {
    timer1 = null;
    showScreen('s3');
  }, 950);
}

/* ─────────────────────────────────
   SCHEDULE NEXT PITCH
───────────────────────────────── */
function scheduleNextPitch() {
  timer1 = setTimeout(() => {
    timer1 = null;
    if (session.current >= session.total) { showScreen('s4'); return; }
    showResult('');
    drawField();
    busy = false;
    timer2 = setTimeout(() => { timer2=null; throwPitch(); }, 450);
  }, 850);
}

───────────────────────────────── */
function showResult(txt, cls='') {
  const el = document.getElementById('resultText');
  el.textContent = txt;
  el.className   = 'result-text' + (txt?' show':'') + (cls?' '+cls:'');
}

/* ─────────────────────────────────
   BATTER SWING ANIMATION
───────────────────────────────── */
function startBatterSwing() {
  const t0  = performance.now();
  const dur = 260;
  function frame(ts) {
    swingAnim.progress = Math.min((ts - t0) / dur, 1);
    drawField();
    if (swingAnim.progress < 1) requestAnimationFrame(frame);
    else setTimeout(() => { swingAnim.progress = null; }, 450);
  }
  requestAnimationFrame(frame);
}

/* ─────────────────────────────────
   INPUT
───────────────────────────────── */
canvas.addEventListener('click', () => swing(null));

let tStartY=0, tStartX=0;
canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  tStartY = e.touches[0].clientY;
  tStartX = e.touches[0].clientX;
},{passive:false});
canvas.addEventListener('touchend', e=>{
  e.preventDefault();
  const dy = e.changedTouches[0].clientY - tStartY;
  const dx = e.changedTouches[0].clientX - tStartX;
  let dir = null;
  if (Math.abs(dy) > 28 && Math.abs(dy) > Math.abs(dx)) dir = dy<0?'up':'down';
  swing(dir);
},{passive:false});

/* ─────────────────────────────────
   PARTICLES
───────────────────────────────── */
function spawnParticles() {
  const cont   = document.getElementById('particles');
  const colors = ['#FFD700','#FF6B9D','#00E5FF','#FF4444','#4CAF50','#FF8C00'];
  for (let i=0;i<22;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = (25+Math.random()*50)+'%';
    p.style.top  = (15+Math.random()*35)+'%';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    const angle = Math.random()*360;
    const dist  = 70+Math.random()*130;
    p.style.setProperty('--tx', Math.cos(angle*Math.PI/180)*dist+'px');
    p.style.setProperty('--ty', Math.sin(angle*Math.PI/180)*dist+'px');
    p.style.animationDuration = (0.7+Math.random()*0.6)+'s';
    cont.appendChild(p);
    setTimeout(()=>p.remove(), 1400);
  }
}

/* ─────────────────────────────────
   S3: TOPVIEW
───────────────────────────────── */
const tvC   = document.getElementById('topview-canvas');
const tvCtx = tvC.getContext('2d');

/* 타구 각도: 우/좌타자, 방향별로 파울라인 안쪽 보장 */
function hitAngleDeg(dir) {
  const isRight = cfg.batterSide !== 'left';
  // 우타자: pull=3루방향(좌측), oppo=1루방향(우측)
  // 파울라인 = ±45도(=-135°/-45°), 안타는 반드시 그 안쪽
  if (isRight) {
    if (dir==='pull')   return -(108 + Math.random()*14); // -108 ~ -122 (파울라인 -135 안쪽)
    if (dir==='center') return -(82  + Math.random()*16); // -82  ~ -98
    return               -(53  + Math.random()*14);       // oppo: -53 ~ -67 (파울라인 -45 안쪽)
  } else {
    // 좌타자: pull=1루(우), oppo=3루(좌)
    if (dir==='pull')   return -(53  + Math.random()*14);
    if (dir==='center') return -(82  + Math.random()*16);
    return               -(108 + Math.random()*14);
  }
}

function drawTopview() {
  const hit = window._lastHit;
  if (!hit) return;

  const dpr2 = window.devicePixelRatio||1;
  const W2 = tvC.offsetWidth, H2 = tvC.offsetHeight;
  tvC.width = W2*dpr2; tvC.height = H2*dpr2;
  tvCtx.setTransform(dpr2,0,0,dpr2,0,0);

  /* 레이아웃: 홈플레이트를 화면 하단에, 투수 마운드/외야가 위쪽으로 펼쳐지는 구도 */
  const sc    = Math.min(W2, H2) * 0.30 / 140;
  const bR    = 28 * sc;
  const homeX = W2 / 2;
  const homeY = H2 * 0.80;           // 홈플레이트를 화면 80% 아래에
  const cx    = homeX;
  const cy    = homeY - bR;          // 다이아몬드 중심
  const outR  = 148 * sc;            // 외야 반경

  function drawBase() {
    /* 하늘 배경 */
    tvCtx.fillStyle = '#87CEEB'; tvCtx.fillRect(0,0,W2,H2);

    /* 외야 잔디 (홈 기준 반원) */
    tvCtx.beginPath();
    tvCtx.moveTo(homeX, homeY);
    tvCtx.arc(homeX, homeY, outR, Math.PI*1.25, Math.PI*1.75);
    tvCtx.closePath();
    tvCtx.fillStyle = '#3DA550'; tvCtx.fill();

    /* 내야 흙 원 */
    tvCtx.beginPath(); tvCtx.arc(cx, cy, 54*sc, 0, Math.PI*2);
    tvCtx.fillStyle = '#C8A96E'; tvCtx.fill();

    /* 다이아몬드 */
    tvCtx.beginPath();
    tvCtx.moveTo(homeX, homeY);               // 홈
    tvCtx.lineTo(homeX + bR, homeY - bR);     // 1루
    tvCtx.lineTo(homeX, homeY - 2*bR);        // 2루
    tvCtx.lineTo(homeX - bR, homeY - bR);     // 3루
    tvCtx.closePath();
    tvCtx.fillStyle = '#B09060'; tvCtx.fill();
    tvCtx.strokeStyle = 'rgba(255,255,255,0.7)'; tvCtx.lineWidth = 1.5; tvCtx.stroke();

    /* 투수 마운드 */
    const mX = homeX, mY = homeY - bR*1.35;  // 홈→2루 방향 중간
    tvCtx.beginPath(); tvCtx.ellipse(mX, mY, 7*sc, 5*sc, 0, 0, Math.PI*2);
    tvCtx.fillStyle = '#D4A96A'; tvCtx.fill();
    tvCtx.strokeStyle = '#2D2D2D'; tvCtx.lineWidth = 1.5; tvCtx.stroke();

    /* 베이스 */
    [[homeX,homeY],[homeX+bR,homeY-bR],[homeX,homeY-2*bR],[homeX-bR,homeY-bR]].forEach(([bx2,by2],i)=>{
      const sz = i===0 ? 7 : 5;
      tvCtx.fillStyle = i===0 ? '#FAFAF0' : '#FFFFFF';
      tvCtx.fillRect(bx2-sz, by2-sz, sz*2, sz*2);
      tvCtx.strokeStyle = '#2D2D2D'; tvCtx.lineWidth = 1.5;
      tvCtx.strokeRect(bx2-sz, by2-sz, sz*2, sz*2);
    });

    /* 파울라인 (홈→외야펜스 방향, 정확히 45도) */
    tvCtx.strokeStyle = 'rgba(255,255,255,0.65)'; tvCtx.lineWidth = 1.5;
    const foulLen = outR * 1.02;
    tvCtx.beginPath(); tvCtx.moveTo(homeX,homeY);
    tvCtx.lineTo(homeX - foulLen*0.707, homeY - foulLen*0.707); tvCtx.stroke();
    tvCtx.beginPath(); tvCtx.moveTo(homeX,homeY);
    tvCtx.lineTo(homeX + foulLen*0.707, homeY - foulLen*0.707); tvCtx.stroke();

    /* 외야 펜스 반원 (홈 기준 225°→315°) */
    tvCtx.strokeStyle = '#2D2D2D'; tvCtx.lineWidth = 3;
    tvCtx.beginPath();
    tvCtx.arc(homeX, homeY, outR, Math.PI*1.25, Math.PI*1.75);
    tvCtx.stroke();

    /* 방향 라벨 */
    tvCtx.font = `bold ${Math.round(10*sc+6)}px sans-serif`;
    tvCtx.fillStyle = 'rgba(255,255,255,0.55)';
    tvCtx.textAlign = 'center';
    tvCtx.fillText('CF', homeX, homeY - outR*0.82);
    tvCtx.fillText('LF', homeX - outR*0.62, homeY - outR*0.62);
    tvCtx.fillText('RF', homeX + outR*0.62, homeY - outR*0.62);
  }

  drawBase();

  const deg = hitAngleDeg(hit.dir);
  const rad = deg * Math.PI / 180;
  const dPx = hit.distance * sc;
  const lx  = homeX + Math.cos(rad)*dPx;
  const ly  = homeY + Math.sin(rad)*dPx;

  let prog = 0;
  function animTV(){
    prog = Math.min(prog+0.022, 1);
    tvCtx.clearRect(0,0,W2,H2);
    drawBase();

    const cx2 = homeX + (lx-homeX)*prog;
    const cy2 = homeY + (ly-homeY)*prog;

    /* 궤적 */
    tvCtx.strokeStyle='#00E5FF'; tvCtx.lineWidth=2.5;
    tvCtx.setLineDash([6,4]);
    tvCtx.beginPath(); tvCtx.moveTo(homeX,homeY); tvCtx.lineTo(cx2,cy2);
    tvCtx.stroke(); tvCtx.setLineDash([]);

    /* 공 */
    tvCtx.beginPath(); tvCtx.arc(cx2,cy2,5,0,Math.PI*2);
    tvCtx.fillStyle='#FAFAF0'; tvCtx.fill();
    tvCtx.strokeStyle='#2D2D2D'; tvCtx.lineWidth=1.5; tvCtx.stroke();

    if (prog<1) requestAnimationFrame(animTV);
    else {
      drawPin(lx,ly);
      let w=0;
      const wI=setInterval(()=>{
        w++;
        tvCtx.strokeStyle=`rgba(255,68,68,${1-w*0.14})`;
        tvCtx.lineWidth=2;
        tvCtx.beginPath(); tvCtx.arc(lx,ly,w*6,0,Math.PI*2); tvCtx.stroke();
        if(w>5) clearInterval(wI);
      },75);
    }
  }
  animTV();

  function drawPin(px,py){
    tvCtx.beginPath(); tvCtx.arc(px,py-11,7,0,Math.PI*2);
    tvCtx.fillStyle='#FF4444'; tvCtx.fill();
    tvCtx.strokeStyle='#2D2D2D'; tvCtx.lineWidth=2; tvCtx.stroke();
    tvCtx.strokeStyle='#FF4444'; tvCtx.lineWidth=2.5;
    tvCtx.beginPath(); tvCtx.moveTo(px,py-4); tvCtx.lineTo(px,py+2); tvCtx.stroke();
  }
}

───────────────────────────────── */
function buildResults() {
  const s  = session.stats;
  const ab = session.atbats || 1;
  const h  = session.hits;
  const avg= h/ab;
  const avgStr = '.'+String(Math.round(avg*1000)).padStart(3,'0');

  document.getElementById('s4Avg').textContent    = avgStr;
  document.getElementById('s4AvgSub').textContent = `${h}안타 / ${ab}타석`;

  const rows = [
    { label:'스트라이크 (루킹)', count:s.strike, e:'🔴' },
    { label:'스윙 아웃',         count:s.miss,   e:'💨' },
    { label:'볼',                count:s.ball,   e:'🔵' },
    { label:'안타',              count:s.hit,    e:'💥' },
    { label:'홈런',              count:s.homerun,e:'🚀' },
    { label:'파울',              count:s.foul,   e:'🟠' },
  ];
  document.getElementById('s4StatRows').innerHTML =
    rows.map(r=>`<div class="stat-row">
      <span class="stat-name">${r.label}</span>
      <div class="stat-balls">${'<span>'+r.e+'</span>'.repeat(r.count)}</div>
    </div>`).join('');

  document.getElementById('s4MaxDist').textContent =
    `최장 비거리: ${session.maxDist||'—'}m 🚀`;
  const dc  = session.dirCount;
  const top = Object.keys(dc).sort((a,b)=>dc[b]-dc[a])[0];
  document.getElementById('s4BestDir').textContent =
    `최다 타구 방향: ${top?DIR_LABEL[top]:'—'}`;
}
