# 매일 KBO 데이터 증분 갱신 → 정규화 JSON 커밋 (T-21)
#
# ⚠ 활성화 방법: 이 파일을 저장소 루트의 .github/workflows/ 로 옮겨야 실행됩니다.
#   (모노레포에서는 루트 .github/workflows 만 GitHub Actions 가 인식하므로,
#    proto-12-kbo/.github/ 안에 있는 동안은 dormant 상태로 실행되지 않습니다.)
#   working-directory 가 proto-12-kbo 로 설정되어 있어 루트로 옮기면 그대로 동작합니다.
#
# KST 자정 이후(경기 종료 후) 실행: 15:30 UTC = 00:30 KST
name: update-kbo-data

on:
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: proto-12-kbo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proto-12-kbo/package-lock.json

      - run: npm ci

      - name: 증분 갱신 (최근 3일 + 선수 기록)
        run: npm run data:update

      - name: 스키마 검증
        run: npm run data:validate

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/normalized public/data
          git diff --cached --quiet || git commit -m "chore(data): KBO daily incremental update $(date -u +%Y-%m-%d)"
          git push
