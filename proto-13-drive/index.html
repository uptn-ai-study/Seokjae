<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#E9E9EF" />
<title>서울 드라이브 — 오픈월드 미니 주행 시뮬레이터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/variable/SUIT-Variable.min.css" />
<style>
:root{
  --primary:#5F46FF; --primary-dark:#4A35E0; --primary-light:#EEEAFF; --primary-200:#F2F0FF;
  --card-bg:#FFFFFF; --muted-bg:#F5F5F8; --border:#E5E7EB;
  --text-1:#111827; --text-2:#6B7280; --text-3:#9CA3AF;
  --success:#10B981; --error:#EF4444;
  --sh1:0 1px 4px rgba(0,0,0,.06); --sh2:0 4px 16px rgba(0,0,0,.10);
  --sh3:0 -4px 24px rgba(0,0,0,.10); --shfab:0 4px 20px rgba(0,0,0,.25);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:'SUIT Variable','SUIT',-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--text-1); background:#E9E9EF; touch-action:none; user-select:none;
}
#app{position:fixed;inset:0}
#game{position:absolute;inset:0;display:block}
#app.picking #game{cursor:crosshair}

/* ---------- 로딩 ---------- */
#loading{
  position:absolute;inset:0;z-index:400;background:#E9E9EF;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
}
.load-title{font-size:22px;font-weight:700;letter-spacing:-.3px}
.load-sub{font-size:14px;color:var(--text-2)}
.load-bar{width:140px;height:4px;border-radius:9999px;background:var(--border);overflow:hidden}
.load-bar i{display:block;width:40%;height:100%;background:var(--primary);border-radius:9999px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
.load-err{text-align:center;font-size:15px;font-weight:700;color:var(--error);line-height:1.7}
.load-err span,.load-err code{display:inline-block;font-weight:400;font-size:13px;color:var(--text-2)}
.load-err code{background:var(--muted-bg);border:1px solid var(--border);border-radius:8px;padding:2px 8px;margin-top:6px}

/* ---------- HUD ---------- */
.hud{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:20;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.card{background:var(--card-bg);border-radius:16px;padding:16px;box-shadow:var(--sh1)}
.speed-card{display:flex;align-items:baseline;gap:6px;padding:12px 16px;border-radius:16px}
#hud-speed{font-size:36px;font-weight:700;letter-spacing:-.5px;line-height:1;min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
#hud-speed.warn{color:var(--error)}
.speed-unit{font-size:13px;color:var(--text-2);letter-spacing:-.2px}
.odo{font-size:12px;color:var(--text-3);letter-spacing:-.2px;margin-left:6px}
.road-badge{
  background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:9999px;
  padding:5px 12px;font-size:13px;font-weight:600;color:var(--text-1);
  max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:var(--sh1);
}

/* ---------- 루트 카드 ---------- */
#route-card{
  display:none;flex-direction:column;gap:10px;width:min(260px,60vw);
  background:var(--card-bg);border-radius:16px;padding:14px 16px;box-shadow:var(--sh1);
}
#route-card.show{display:flex}
.route-top{display:flex;align-items:baseline;gap:8px}
#route-dist{font-size:22px;font-weight:700;letter-spacing:-.3px}
#route-time{font-size:14px;color:var(--text-2)}
#route-state{font-size:12px;color:var(--primary);font-weight:600;letter-spacing:-.2px}
#route-state.off{color:var(--text-3)}
.btn-gray{
  height:44px;background:var(--muted-bg);color:var(--text-2);border:1px solid var(--border);
  font-size:13px;font-weight:600;letter-spacing:-.3px;border-radius:12px;cursor:pointer;
}
.btn-gray:active{background:#ECECF2}

/* ---------- 우측 액션 ---------- */
.actions{
  position:absolute;right:12px;bottom:calc(20px + var(--safe-b));z-index:20;
  display:flex;flex-direction:column;gap:10px;align-items:center;
}
.fab{
  width:52px;height:52px;border-radius:9999px;border:none;cursor:pointer;
  background:#1F2937;color:#fff;font-size:20px;box-shadow:var(--shfab);
  display:flex;align-items:center;justify-content:center;
}
.fab:active{background:#111827}
.fab.small{width:44px;height:44px;font-size:18px;background:#fff;color:var(--text-1);border:1px solid var(--border);box-shadow:var(--sh1)}
.fab.small:active{background:var(--muted-bg)}
.fab.active{background:var(--primary)}
.fab.active:active{background:var(--primary-dark)}

/* ---------- 모바일 주행 컨트롤 ---------- */
.controls{position:absolute;left:0;right:0;bottom:calc(16px + var(--safe-b));z-index:20;display:none;justify-content:space-between;padding:0 16px;pointer-events:none}
body.touch .controls{display:flex}
.ctrl-group{display:flex;gap:12px;pointer-events:auto}
.ctrl{
  width:68px;height:68px;border-radius:9999px;border:1px solid var(--border);
  background:rgba(255,255,255,.94);box-shadow:var(--sh2);
  font-size:22px;font-weight:700;color:var(--text-1);
  display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;
}
.ctrl.pressed{background:var(--primary-200);border-color:var(--primary);color:var(--primary)}
.ctrl.gas{background:var(--primary);color:#fff;border-color:var(--primary);font-size:15px}
.ctrl.gas.pressed{background:var(--primary-dark)}
.ctrl.stop{font-size:14px;color:var(--text-2)}
body.touch .actions{bottom:calc(100px + var(--safe-b))}

/* ---------- 토스트 ---------- */
#toast{
  position:absolute;left:50%;transform:translate(-50%,12px);z-index:120;
  top:calc(14px + env(safe-area-inset-top,0px));
  background:rgba(17,24,39,.92);color:#fff;font-size:14px;font-weight:600;letter-spacing:-.2px;
  padding:10px 16px;border-radius:9999px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;
  max-width:80vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* 좁은 화면에선 상단 HUD와 겹치므로 하단(주행 컨트롤 위)으로 */
@media (max-width:520px){
  #toast{top:auto;bottom:calc(96px + var(--safe-b));transform:translate(-50%,-12px)}
  #toast.show{transform:translate(-50%,0)}
}

/* ---------- 바텀시트 ---------- */
#sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.50);display:none;align-items:flex-end;z-index:200}
#sheet{
  width:100%;max-width:520px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;
  padding:12px 12px calc(28px + var(--safe-b));box-shadow:var(--sh3);
  display:flex;flex-direction:column;align-items:center;gap:16px;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,1,.55,1);
}
#sheet.open{transform:translateY(0)}
.bs-handle{width:36px;height:4px;background:var(--border);border-radius:2px}
.bs-header{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 8px}
.bs-title{font-size:18px;font-weight:700;letter-spacing:-.3px}
.bs-close{
  width:30px;height:30px;border-radius:50%;background:var(--muted-bg);border:1px solid var(--border);
  font-size:13px;color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;
}
#sheet-body{width:100%;padding:0 8px;display:flex;flex-direction:column;gap:14px}
.key-grid{display:flex;flex-direction:column;gap:10px}
.key-row{display:flex;align-items:center;gap:8px}
.kbd{
  min-width:34px;height:32px;padding:0 8px;border-radius:8px;background:var(--muted-bg);
  border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;color:var(--text-1);
}
.kbd.wide{min-width:64px}
.key-desc{font-size:14px;color:var(--text-2);margin-left:4px}
.sheet-note{
  background:var(--primary-200);border-radius:12px;padding:12px 14px;
  font-size:13px;line-height:1.65;color:#4B5563;
}
.sheet-note b{color:var(--primary)}
.btn-primary{
  width:100%;height:56px;background:var(--primary);color:#fff;border:none;border-radius:12px;
  font-size:16px;font-weight:700;letter-spacing:-.3px;cursor:pointer;
}
.btn-primary:active{background:var(--primary-dark)}

/* ---------- 데스크톱 힌트 ---------- */
.desk-hint{
  position:absolute;left:12px;bottom:calc(14px + var(--safe-b));z-index:20;display:none;
  background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:12px;
  padding:8px 12px;font-size:12px;color:var(--text-2);box-shadow:var(--sh1);letter-spacing:-.2px;
}
body.desktop .desk-hint{display:block}
@media (max-height:520px){.hud{gap:6px}#hud-speed{font-size:28px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="card speed-card">
      <span id="hud-speed">0</span>
      <span class="speed-unit">km/h</span>
      <span class="odo" id="hud-odo">0m</span>
    </div>
    <div class="road-badge" id="hud-road">도로 탐색 중…</div>
    <div id="route-card">
      <div class="route-top">
        <span id="route-dist">-</span>
        <span id="route-time">-</span>
      </div>
      <div id="route-state">추천 경로 안내 중</div>
      <button class="btn-gray" id="btn-route-cancel">안내 종료</button>
    </div>
  </div>

  <div class="actions">
    <button class="fab small" id="btn-zoom-in" aria-label="확대">＋</button>
    <button class="fab small" id="btn-zoom-out" aria-label="축소">－</button>
    <button class="fab small" id="btn-help" aria-label="조작법">?</button>
    <button class="fab small" id="btn-random" aria-label="랜덤 목적지">🎲</button>
    <button class="fab" id="btn-dest" aria-label="목적지 지정">📍</button>
  </div>

  <div class="controls">
    <div class="ctrl-group">
      <div class="ctrl" id="ctrl-left">◀</div>
      <div class="ctrl" id="ctrl-right">▶</div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl stop" id="ctrl-brake">STOP</div>
      <div class="ctrl gas" id="ctrl-gas">GO</div>
    </div>
  </div>

  <div class="desk-hint">W A S D / 방향키 주행 · Space 브레이크 · +/- 줌 · H 조작법 · R 랜덤 목적지</div>

  <div id="toast"></div>

  <div id="sheet-overlay">
    <div id="sheet">
      <div class="bs-handle"></div>
      <div class="bs-header">
        <span class="bs-title" id="sheet-title">조작법</span>
        <button class="bs-close" id="sheet-close">✕</button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="loading">
    <div class="load-title">서울 드라이브</div>
    <div class="load-sub">도로 데이터를 불러오는 중…</div>
    <div class="load-bar"><i></i></div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
